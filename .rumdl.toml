# rumdl configuration — 繁中開發文檔用
# 由 PostToolUse hook 自動套用:Claude 寫完 .md 後跑 `rumdl fmt <file>`
# 規則說明:https://rumdl.dev/

[global]
# 註:rumdl 0.2.55 的 `flavor` 在這裡設定無效(config get 一律回報 standard,
# per-file-flavor 也註冊不上),所以沒寫。表格規則 MD055/MD056 本來就是啟用的,
# 本 repo 的表格與清單目前 lint 全過,實務上沒有差別。

disable = [
    # 行長度限制。中文文檔沒有 reflow 的意義,本 repo 最長行 458 字元
    "MD013",
    # 「不得使用 inline HTML」。文檔裡的 <slug>、<today> 是佔位符,不是 HTML
    "MD033",
    # 「圍籬程式碼區塊必須標語言」。開著會把所有裸 ``` 自動改成 ```text
    # (目錄樹、指令範例都會被改)。想要自動補語言標記就把這行刪掉
    "MD040",
]

# MD056(表格欄數不一致)只警告、不自動修。
# 它的自動修法會把多出來的儲存格「直接刪掉」,內容無聲遺失。
# 保留 check 的警告,由人決定怎麼補欄位。
unfixable = ["MD056"]

exclude = [
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build",
    "CHANGELOG.md",
    "LICENSE.md",
]

# 掃描目錄時遵守 .gitignore
respect-gitignore = true

# 無序清單一律用 "-"(本 repo 現況 69/69 都是 dash)
[MD004]
style = "dash"

# 標題一律 ATX 樣式(# Heading),不用底線式
[MD003]
style = "atx"

# 重複標題:預設 siblings-only = true,只有「同一層同一父標題下」重複才算違規。
# spec/bugfix 文檔在不同章節下各有「測試」「相依性」小節不會被誤判,
# 所以維持預設即可。若要完全允許重複標題,取消下面兩行的註解:
# [MD024]
# siblings-only = false
# allow-different-nesting = true
