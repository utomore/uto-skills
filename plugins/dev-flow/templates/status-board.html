<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看板</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#eeeae1; --panel:#fffdf7; --ink:#23201b; --faint:#6f6a60; --rule:#ddd6c8;
  --paper:#fff8d8; --tape:rgba(0,0,0,.08); --grid:rgba(0,0,0,.055);
  --done:#2f8f5b; --stuck:#c2453c; --wait:#c98a1d; --going:#3a72c4; --idle:#8b8578;
  --wire:#a39c8c; --sideW:360px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161513; --panel:#232120; --ink:#eae6dd; --faint:#9d968a; --rule:#39352f;
    --paper:#3a3526; --tape:rgba(255,255,255,.08); --grid:rgba(255,255,255,.05); --wire:#6b6455;
    --done:#5fbd85; --stuck:#e2706a; --wait:#e0ab4a; --going:#6ea3e8; --idle:#8b8578;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;}
h1,h2,h3{margin:0;font-weight:600}

/* 上方:一行標頭 + 一行工具列,其餘全給畫布 */
#top{position:relative;z-index:10;background:var(--panel);border-bottom:1px solid var(--rule)}
#head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 16px 0}
#head h1{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--faint);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
#tests{font-size:12px;color:var(--faint);padding:2px 16px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px}
.bar button,.bar select{font:inherit;font-size:12px;padding:4px 11px;border:1px solid var(--rule);border-radius:999px;
  background:transparent;color:var(--faint);cursor:pointer}
.bar select{border-radius:6px;padding:4px 6px}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.bar input{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;
  background:transparent;color:inherit;min-width:170px}
.bar .sep{width:1px;height:18px;background:var(--rule)}
.bar .spacer{flex:1}
.bar label{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px}
#zoom{font-size:12px;color:var(--faint);min-width:44px;text-align:center}
.legend{display:flex;gap:9px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.legend span{cursor:help}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}

/* 畫布:平移縮放的無限平面 */
#stage{position:absolute;inset:0;top:var(--topH,108px);overflow:hidden;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:26px 26px}
#stage.grabbing{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none}
#links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#links path{fill:none}
#links .tree{stroke:var(--wire);stroke-width:1.6;opacity:.5}
#links .ref{stroke:var(--wire);stroke-width:1.4;opacity:.45;stroke-dasharray:6 5;marker-end:url(#arrow)}
#links .ref.blocking{stroke:var(--wait);opacity:.6;marker-end:url(#arrowWait)}
#links .lit{stroke:var(--going);stroke-width:2.4;opacity:1;stroke-dasharray:none;marker-end:url(#arrowLit)}
#links.refs-off .ref{display:none}
#links.refs-sel .ref:not(.lit){display:none}
#world2{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none}
#links2{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#links2 path{fill:none}
#links2 .dep{stroke:var(--wire);stroke-width:1.8;opacity:.7;marker-end:url(#arrow2)}
#links2 .dep.inverted{stroke:var(--stuck);opacity:.85;marker-end:url(#arrowStuck2)}
#links2 .dep.cycle{stroke-dasharray:5 5}
#links2 .dep.lit{stroke:var(--going);stroke-width:2.6;opacity:1;marker-end:url(#arrowLit2)}
#links2 .dep.faded{opacity:.12}
body.view-dag .tree-only{display:none}
body:not(.view-dag) .dag-only{display:none}

/* 相依:目標或需求一張卡,左邊先做、右邊後做 */
.dnode{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--edge, var(--rule));
  box-shadow:0 3px 10px rgba(0,0,0,.1);cursor:pointer;padding:10px 13px 9px}
.dnode[data-tone=done]{--edge:var(--done)}
.dnode[data-tone=stuck]{--edge:var(--stuck)}
.dnode[data-tone=wait]{--edge:var(--wait)}
.dnode[data-tone=going]{--edge:var(--going)}
.dnode[data-tone=idle]{--edge:var(--idle)}
.dnode[data-kind-of=requirement]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.dnode[data-kind-of=shared]{background:var(--paper)}
.dnode .k{font-size:11px;letter-spacing:.05em;opacity:.7}
.dnode .name{font-weight:600;font-size:13.5px;margin-top:2px;line-height:1.45;word-break:break-all}
.dnode .n{font-size:12px;margin-top:5px;opacity:.75}
.dnode .n b{color:var(--stuck)}

.card{position:absolute;border-radius:3px;padding:12px 14px}
.dim{opacity:.13}
.card.sel{outline:2px solid var(--going);outline-offset:3px}
.card.rel{outline:2px dashed var(--going);outline-offset:3px}
.card.path{outline:1px solid var(--going);outline-offset:2px}

/* 根:願景 */
.vision{background:var(--panel);border:1px solid var(--rule);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.vision h2{font-size:13px;color:var(--faint);letter-spacing:.08em;font-weight:500}
.vision p{margin:6px 0 0;font-size:13.5px;line-height:1.75}
.vision p.none{color:var(--stuck)}

/* 優先度區塊的標籤 */
.band{background:var(--ink);color:var(--panel);border:1px solid var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.14)}
.band .t{font-size:14px;font-weight:700;letter-spacing:.04em}
.band .n{font-size:11.5px;margin-top:4px;opacity:.72;line-height:1.5}
.band[data-done=y]{background:var(--done);border-color:var(--done)}

/* 目標 / 里程碑 */
.lane,.group{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--edge, var(--rule));
  box-shadow:0 3px 10px rgba(0,0,0,.08)}
.lane[data-done=y],.group[data-done=y]{--edge:var(--done)}
.lane[data-done=n],.group[data-done=n]{--edge:var(--going)}
.lane .t,.group .t{font-size:13.5px;font-weight:600;line-height:1.5}
.lane .n,.group .n{font-size:12px;color:var(--faint);margin-top:4px}
.group .t{font-size:13px}

/* 便利貼 */
.note{background:var(--paper);box-shadow:0 5px 12px rgba(0,0,0,.16);border-top:4px solid var(--edge);
  cursor:pointer;padding:11px 13px 9px;transition:box-shadow .12s ease,opacity .18s ease}
.note::after{content:"";position:absolute;top:-7px;left:50%;width:50px;height:13px;
  transform:translateX(-50%) rotate(-2deg);background:var(--tape)}
.note:hover{box-shadow:0 10px 22px rgba(0,0,0,.24)}
.note[data-tone=done]{--edge:var(--done)}
.note[data-tone=stuck]{--edge:var(--stuck)}
.note[data-tone=wait]{--edge:var(--wait)}
.note[data-tone=going]{--edge:var(--going)}
.note[data-tone=idle]{--edge:var(--idle)}
.note .name{font-weight:600;font-size:13.5px;word-break:break-all}
.note .desc{font-size:12px;color:var(--faint);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .state{font-size:12px;margin-top:6px;color:var(--edge);font-weight:600}
.note .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.note .meta span{font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;color:var(--faint)}
.note .meta span.bad{border-color:var(--stuck);color:var(--stuck)}
.note.ghost{background:transparent;border:1px dashed var(--stuck);border-top-width:4px;color:var(--stuck);box-shadow:none}
.note.ghost::after{display:none}

/* 右邊那一欄:沒選東西時是派工,選了便利貼就換成那一份的細節 */
aside{position:absolute;right:0;top:var(--topH,108px);bottom:0;width:var(--sideW);z-index:8;overflow:auto;
  background:var(--panel);border-left:1px solid var(--rule);padding:16px 14px}
aside[hidden]{display:none}
aside section{margin-bottom:20px}
aside h3{font-size:12px;letter-spacing:.06em;color:var(--faint);margin-bottom:8px}
aside ol,aside ul{margin:0;padding-left:18px}
aside li{font-size:12.5px;margin-bottom:5px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.warn{border-top:1px solid var(--rule);padding:7px 0;font-size:12px}
.warn b{display:block;color:var(--stuck);font-weight:600}
.warn i{display:block;color:var(--faint);font-style:normal;margin-top:2px}
.empty{color:var(--faint);font-size:12.5px}
#doc h2{font-size:15px;padding-right:56px}
#doc .sub{color:var(--faint);font-size:12.5px;margin-top:3px}
#doc .back{position:absolute;top:12px;right:14px;border:1px solid var(--rule);background:transparent;
  color:var(--faint);border-radius:6px;font:inherit;font-size:12px;padding:2px 9px;cursor:pointer}
#doc section{margin-top:16px}
#doc table{width:100%;border-collapse:collapse;font-size:12px}
#doc th{text-align:left;color:var(--faint);font-weight:500;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
#doc td{padding:4px 6px 4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
#doc td.s{white-space:nowrap}
#doc .jump{background:none;border:0;padding:0;font:inherit;color:var(--going);cursor:pointer;text-decoration:underline}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.g{background:var(--done)} .dot.r{background:var(--stuck)} .dot.y{background:var(--wait)} .dot.n{background:var(--idle)} .dot.e{background:var(--rule)}
.unit{border-top:1px solid var(--rule);padding:8px 0;font-size:12.5px}
.unit b{font-weight:600}
.unit .sub{color:var(--faint);font-size:11.5px;margin-top:3px;line-height:1.5}
.unit .layers{margin-top:4px}
.layer{display:inline-block;font-size:10.5px;letter-spacing:.04em;border:1px solid var(--ink);border-radius:3px;padding:1px 5px;margin-right:4px}
.layer.none{border-color:var(--rule);color:var(--faint)}

/* 小地圖 */
#mini{position:absolute;right:calc(var(--sideNow, var(--sideW)) + 14px);top:calc(var(--topH,108px) + 12px);z-index:9;background:var(--panel);border:1px solid var(--rule);
  border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.16);padding:7px 8px 8px;width:262px}
#mini[hidden]{display:none}
#minihead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#minihead b{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.05em}
#jump{flex:1;min-width:0;font:inherit;font-size:11.5px;padding:2px 4px;border:1px solid var(--rule);
  border-radius:5px;background:transparent;color:var(--faint);cursor:pointer}
#minimap{display:block;width:246px;height:158px;cursor:crosshair;border-radius:4px;background:var(--bg)}

#help{position:absolute;right:calc(var(--sideNow, var(--sideW)) + 16px);top:calc(var(--topH,108px) + 12px + var(--miniH, 0px));z-index:14;width:min(430px,88vw);
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:14px 16px}
#help[hidden]{display:none}
#help h3{margin-bottom:10px}
#help dl{margin:0}
#help dt{font-size:12.5px;font-weight:600;margin-top:9px}
#help dt i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
#help dd{margin:2px 0 0;font-size:12px;color:var(--faint);line-height:1.65}
#help .close{position:absolute;top:10px;right:12px;border:1px solid var(--rule);background:transparent;
  color:var(--faint);border-radius:6px;font:inherit;font-size:12px;padding:2px 9px;cursor:pointer}
#hint{position:absolute;left:14px;bottom:12px;z-index:8;font-size:12px;color:var(--faint);
  background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:3px 12px;opacity:.9}
</style>
</head>
<body>
<div id="top">
  <div id="head"><h1 id="title">看板</h1><div class="chips" id="chips"></div></div>
  <div id="tests"></div>
  <div class="bar">
    <button data-view="tree" aria-pressed="true">樹</button>
    <button data-view="dag" aria-pressed="false">相依</button>
    <span class="sep"></span>
    <button class="tree-only" data-filter="all" aria-pressed="true">全部</button>
    <button class="tree-only" data-filter="open" aria-pressed="false">今天能開</button>
    <button class="tree-only" data-filter="stuck" aria-pressed="false">卡住</button>
    <button class="tree-only" data-filter="todo" aria-pressed="false">未達成</button>
    <button class="tree-only" data-filter="warn" aria-pressed="false">有警訊</button>
    <label class="dag-only">粒度
      <select id="grain">
        <option value="objective" selected>目標</option>
        <option value="requirement">需求</option>
      </select>
    </label>
    <input id="q" type="search" placeholder="找名字、簽名、模組">
    <span class="sep"></span>
    <label class="tree-only">引用連線
      <select id="refmode">
        <option value="sel" selected>只有選取的</option>
        <option value="all">全部顯示</option>
        <option value="off">不顯示</option>
      </select>
    </label>
    <span class="sep tree-only"></span>
    <button id="zoomout">−</button><span id="zoom">100%</span><button id="zoomin">＋</button>
    <button id="fit">符合畫面</button>
    <button id="minitoggle" aria-pressed="true">小地圖</button>
    <button id="side" aria-pressed="true">側欄</button>
    <button id="helpbtn">顏色是什麼意思</button>
    <span class="spacer"></span>
    <span class="legend" id="legend"></span>
  </div>
</div>

<div id="stage"><div id="world"><svg id="links"></svg></div><div id="world2"><svg id="links2"></svg></div></div>

<div id="mini">
  <div id="minihead"><b>小地圖</b><select id="jump"></select></div>
  <canvas id="minimap"></canvas>
</div>
<div id="hint">拖曳平移 · 滾輪上下、Ctrl 滾輪縮放 · 點便利貼看細節 · 點區塊、目標或里程碑縮放到那一叢 · 0 回到全景</div>

<aside id="aside">
  <div id="home">
    <section><h3>建議路線</h3><div id="route"></div></section>
    <section><h3>今天能開幾條線</h3><ul id="lines"></ul></section>
    <section id="modules-section" hidden><h3 id="modules-title">模組</h3><div id="modules"></div></section>
    <section id="dep-section" hidden><h3>相依</h3><div id="deps"></div></section>
    <section><h3>警訊</h3><div id="warnings"></div></section>
  </div>
  <div id="doc" hidden></div>
</aside>

<div id="help" hidden></div>

<script id="data" type="application/json">__STATUS_JSON__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const byName = new Map(D.docs.map((d) => [d.name, d]));
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const links = document.getElementById('links');
const asideEl = document.getElementById('aside');
const homeEl = document.getElementById('home');
const docEl = document.getElementById('doc');
const miniEl = document.getElementById('mini');
const helpEl = document.getElementById('help');
let selected = null;
let filter = 'all';
let query = '';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tone = (d) => (d.achieved ? 'done' : d.gaps.length ? 'stuck' : d.blockedBy.length ? 'wait' : d.status === 'draft' ? 'idle' : 'going');
const dotOf = (r) => (r === 'green' ? 'g' : r === 'red' ? 'r' : r === '未跑' ? 'y' : 'n');

// 便利貼的五個顏色各是什麼判定出來的:圖例、說明面板與細節面板講的是同一句
const TERMS = [
  ['done', '達成', `簽名全部對得上、一個骨架都不剩、laws 與 examples 全綠、沒有還開著的 GAP,而且它引用的${D.labels.unit}也都達成`],
  ['stuck', '卡住', '有還開著的 GAP。GAP 是 qa 或 impl 寫不下去時開的問題,等的是一個決定;回答之前這一份誰都推不動'],
  ['wait', '等別人', `它引用的${D.labels.unit}還沒達成。等的是別份${D.labels.unit}把自己做完,不是等人回答;那一份達成了這一份才輪得到`],
  ['going', '進行中', `契約已經 ready,沒有 GAP 也沒有在等別人,只是還沒全綠——${D.labels.steps}、測試或實作還缺東西。今天就能派`],
  ['idle', 'draft', '契約還是 draft:規格還沒定案,還不能派測試也還不能派實作'],
];

// 標頭
document.title = `${D.tool} 看板`;
document.getElementById('title').textContent = `${D.tool} 看板`;
document.getElementById('chips').innerHTML = D.headline
  .map((c) => `<span class="chip">${esc(c.label)} <b>${esc(c.value)}</b></span>`).join('');
document.getElementById('tests').textContent = `${D.tests} ·`;
document.getElementById('legend').innerHTML = TERMS
  .map(([t, name, why]) => `<span title="${esc(why)}"><i style="background:var(--${t})"></i>${esc(name)}</span>`).join('')
  + '<span title="虛線箭頭:箭頭那一端是被引用的那一份"><i style="background:var(--wire)"></i>引用</span>';
helpEl.innerHTML = `<button class="close">關閉</button><h3>便利貼的顏色</h3><dl>${
  TERMS.map(([t, name, why]) => `<dt><i style="background:var(--${t})"></i>${esc(name)}</dt><dd>${esc(why)}</dd>`).join('')
}<dt><i style="background:var(--wire)"></i>虛線箭頭</dt><dd>引用:箭頭那一端是被引用的那一份,一條弧線從右邊繞過去。預設只畫選取那一份的,工具列可以改成全部顯示。實線是樹的骨架(願景 → 優先度區塊 → 目標 → 里程碑 → ${esc(D.labels.unit)}),每深一層往右縮排一格</dd>
<dt><i style="background:var(--wire)"></i>相依頁籤</dt><dd>目標(或需求)排成先後:左邊那一個達成了,右邊那一個才做得到。邊不是人寫的,是從${esc(D.labels.unit)}的引用推出來的:綁在目標甲底下的一份引用了綁在目標乙底下的一份,甲就依賴乙;沒被任何里程碑綁的那份自成一張「共用」卡。紅色的邊是優先倒掛:高優先的目標依賴低優先的目標。虛線的邊是互相依賴</dd></dl>`;
const setTopHeight = () => document.body.style.setProperty('--topH', document.getElementById('top').offsetHeight + 'px');

// 側欄的首頁:派工
document.getElementById('route').innerHTML = D.route.steps.length
  ? `<ol>${D.route.steps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>`
  : `<p class="empty">${esc(D.route.note || '')}</p>`;
const lineItems = [
  ...D.lines.openable.map((x) => `<li><b>${esc(x.name)}</b><br><span class="empty">${esc(x.tag)}</span></li>`),
  ...D.lines.building.map((x) => `<li><b>${esc(x.name)}</b><br><span class="empty">建構中,分支 build/${esc(x.name)}</span></li>`),
  ...D.lines.shared.map((x) => `<li class="empty">${esc(x.a)} 與 ${esc(x.b)} 的 ${esc(D.labels.steps)} 都住 ${(x.units || x.files || []).map((f) => `<code>${esc(f)}</code>`).join('、')},可以同時開</li>`),
];
document.getElementById('lines').innerHTML = lineItems.length ? lineItems.join('') : '<li class="empty">一條都開不了</li>';
document.getElementById('warnings').innerHTML = D.warnings.length
  ? D.warnings.map((w) => `<div class="warn"><b>${esc(w.where)}</b>${esc(w.what)}<i>${esc(w.fix)}</i></div>`).join('')
  : '<p class="empty">無</p>';

// 模組:一個模組單元一列,層是它在原始碼樹裡的落點,pipeline 點得進去。沒有這份資料就整段不出現。
if (D.modules && (D.modules.units.length || D.modules.unregistered.length)) {
  const mods = D.modules;
  document.getElementById('modules-section').hidden = false;
  document.getElementById('modules-title').textContent = `模組(${mods.units.length} 個單元)`;
  const layerCell = (u) => u.layerState.map((l) => `<span class="layer${l.empty ? ' none' : ''}" title="${esc(l.root)}/">${esc(l.layer)}</span>`).join('');
  const rows = mods.units.map((u) => `<div class="unit" data-unit="${esc(u.unit)}">
    <span class="dot ${u.achieved ? 'g' : u.idle ? 'e' : 'y'}"></span><b>${esc(u.unit)}</b>
    <div class="layers">${layerCell(u)}</div>
    <div class="sub">${esc(u.responsibility || '(職責沒填)')}</div>
    <div class="sub">${u.idle ? '還沒有任何 ' + esc(D.labels.steps) + ' 住進去' : `${esc(D.labels.steps)} ${u.stages} 個,待實作 ${u.todo}`}${u.pipelines.length ? ' · ' + u.pipelines.map((n) => `<a href="#" data-go="${esc(n)}">${esc(n)}</a>`).join('、') : ''}</div>
  </div>`).join('');
  const stray = mods.unregistered.length ? `<div class="unit"><b>不在模組表</b><div class="sub">${mods.unregistered.map((m) => `<code>${esc(m.module)}</code>`).join('、')}</div></div>` : '';
  document.getElementById('modules').innerHTML = rows + stray;
  document.getElementById('modules').addEventListener('click', (ev) => {
    const go = ev.target.closest('[data-go]');
    if (!go) return;
    ev.preventDefault();
    select(go.dataset.go);
  });
}

// ── 這棵樹:從左上往下長,每深一層往右縮排一格 ──
// 願景 → 優先度區塊 → 目標 → 里程碑 → 便利貼;便利貼在里程碑底下折成方陣往右鋪
const NOTE_W = 236, GROUP_W = 360, LANE_W = 620, BAND_W = 420, VISION_W = 660;
const LEFT = 40;          // 願景的左緣,也是整張圖的最左邊
const IND = 36;           // 每深一層往右縮排這麼多
const STUB = 22;          // 接線從子卡片上緣往下這麼多,接進它的左緣
const GAP_DROP = 18;      // 父卡片底下到第一個子卡片
const GAP_NOTE = 16;      // 同一排的便利貼之間
const GAP_NOTE_ROW = 18;  // 便利貼折行之間
const GAP_COL = 28;       // 里程碑卡片到它右邊那一叢便利貼
const GAP_GROUP = 28;     // 里程碑那一叢之間
const GAP_LANE = 40;      // 目標那一叢之間
const GAP_BAND = 58;      // 優先度區塊之間
const MAX_GRID = 1800;    // 便利貼一排最寬到這裡就折行

function noteHtml(name) {
  const d = byName.get(name);
  if (!d) return `<div class="card note ghost" data-kind="note" data-name="${esc(name)}" data-tone="stuck"><div class="name">${esc(name)}</div><div class="state">綁定了,${esc(D.labels.unit)}裡沒有這一份</div></div>`;
  const law = d.laws.total ? `law ${d.laws.green === null ? 'nan' : d.laws.green}/${d.laws.total}` : 'law 0 條';
  const meta = [
    `<span>${esc(d.status || '沒有 status')}</span>`,
    `<span>簽名 ${d.signatures.matched}/${d.signatures.total}</span>`,
    `<span${d.laws.green !== null && d.laws.green < d.laws.total ? ' class="bad"' : ''}>${esc(law)}</span>`,
    d.signatures.stub ? `<span class="bad">骨架 ${d.signatures.stub}</span>` : '',
    d.revisions.count ? `<span>REV ${d.revisions.count}</span>` : '',
    d.building ? '<span>建構中</span>' : '',
  ].filter(Boolean).join('');
  return `<div class="card note" data-kind="note" data-name="${esc(d.name)}" data-tone="${tone(d)}">
    <div class="name">${esc(d.name)}</div>
    <div class="desc">${esc(d.description)}</div>
    <div class="state">${esc(d.state)}</div>
    <div class="meta">${meta}</div></div>`;
}

// 先把每張牌放進畫布量高度,再算位置:內容多高就佔多高,不猜
const html = [];
html.push(`<div class="card vision" data-kind="vision" style="width:${VISION_W}px"><h2>願景</h2>${
  D.vision ? `<p>${esc(D.vision)}</p>` : '<p class="none">還沒訂,或還是模板</p>'}</div>`);
const drawn = new Set();   // 一份文檔綁到兩條里程碑也只畫一張,第一條里程碑收著它
D.bands.forEach((band, bi) => {
  html.push(`<div class="card band" data-kind="band" data-band="${bi}" data-done="${band.achieved ? 'y' : 'n'}" style="width:${BAND_W}px">
    <div class="t">${esc(band.title)}</div><div class="n">${esc(band.note)}</div></div>`);
  const columns = [];
  if (band.bare) band.columns.forEach((col, ci) => columns.push([-1, ci, col]));
  else band.lanes.forEach((lane, li) => {
    html.push(`<div class="card lane" data-kind="lane" data-band="${bi}" data-lane="${li}" data-done="${lane.achieved ? 'y' : 'n'}" style="width:${LANE_W}px">
      <div class="t">${esc(lane.title)}</div>
      ${lane.notes.map((n) => `<div class="n">${esc(n)}</div>`).join('')}
      ${lane.empty ? `<div class="n">${esc(lane.empty)}</div>` : ''}</div>`);
    lane.columns.forEach((col, ci) => columns.push([li, ci, col]));
  });
  for (const [li, ci, col] of columns) {
    col.own = col.docs.filter((n) => !drawn.has(n) && (drawn.add(n), true));
    html.push(`<div class="card group" data-kind="group" data-band="${bi}" data-lane="${li}" data-col="${ci}" data-done="${col.achieved ? 'y' : 'n'}" style="width:${GROUP_W}px">
      <div class="t">${esc(col.title)}</div>
      <div class="n">${col.docs.length} ${esc(D.labels.unit)}${col.achieved ? ' · 達成' : ''}</div></div>`);
    for (const name of col.own) html.push(noteHtml(name));
  }
});
world.insertAdjacentHTML('beforeend', html.join(''));

const cards = [...world.querySelectorAll('.card')];
for (const el of cards) if (!el.style.width) el.style.width = NOTE_W + 'px';
const H = new Map(cards.map((el) => [el, el.offsetHeight]));
const noteEls = new Map();
for (const el of cards) if (el.dataset.kind === 'note') noteEls.set(el.dataset.name, el);
const box = new Map();       // 元素 → {x,y,w,h}
const pick = (sel) => world.querySelector(sel);
const bandEl = (bi) => pick(`.band[data-band="${bi}"]`);
const laneEl = (bi, li) => pick(`.lane[data-band="${bi}"][data-lane="${li}"]`);
const groupEl = (bi, li, ci) => pick(`.group[data-band="${bi}"][data-lane="${li}"][data-col="${ci}"]`);
function place(el, x, y, w) {
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  const b = { x, y, w, h: H.get(el) };
  box.set(el, b);
  return b;
}
const hull = (boxes) => ({
  x1: Math.min(...boxes.map((b) => b.x)), y1: Math.min(...boxes.map((b) => b.y)),
  x2: Math.max(...boxes.map((b) => b.x + b.w)), y2: Math.max(...boxes.map((b) => b.y + b.h)),
});

const visionEl = pick('.vision');
const notesOf = (col) => col.own.map((n) => noteEls.get(n)).filter(Boolean);
const zones = [];            // 「跳到」用得到的範圍
const zoneOf = new Map();    // 卡片 → 點它要縮放到的範圍
const ancestors = new Map(); // 便利貼 → 它上面那一串卡片
const trees = [];            // 每一組「父卡片 → 它的子卡片進線點」

// 便利貼方陣:一排排滿了就往下折,每一排從左緣接一條線進來
const PER_ROW = Math.max(1, Math.floor((MAX_GRID + GAP_NOTE) / (NOTE_W + GAP_NOTE)));
function grid(els, x0, yTop) {
  const rows = [];
  let yy = yTop;
  for (let i = 0; i < els.length; i += PER_ROW) {
    const row = els.slice(i, i + PER_ROW);
    let xx = x0;
    let h = 0;
    for (const el of row) { place(el, xx, yy, NOTE_W); xx += NOTE_W + GAP_NOTE; h = Math.max(h, H.get(el)); }
    rows.push({ x: x0, ey: yy + STUB });
    yy += h + GAP_NOTE_ROW;
  }
  return { rows, bottom: els.length ? yy - GAP_NOTE_ROW : yTop };
}
const entry = (b) => ({ x: b.x, ey: b.y + STUB });

let y = 0;
if (visionEl) { place(visionEl, LEFT, 0, VISION_W); y = H.get(visionEl) + GAP_BAND; }
const bandEntries = [];
D.bands.forEach((band, bi) => {
  const bEl = bandEl(bi);
  const bx = LEFT + IND;
  const bBox = place(bEl, bx, y, BAND_W);
  bandEntries.push(entry(bBox));
  const mine = [bBox];
  const inner = [];
  y += bBox.h + GAP_DROP;

  // 一條里程碑:卡片一張,便利貼在它右邊鋪成方陣,排滿了才往下折
  const putCol = (li, ci, col, x) => {
    const g = groupEl(bi, li, ci);
    const gBox = place(g, x, y, GROUP_W);
    const ns = notesOf(col);
    const gr = grid(ns, x + GROUP_W + GAP_COL, y);
    y = Math.max(gBox.y + gBox.h, gr.bottom);
    trees.push({ from: gBox, kids: gr.rows, side: 'right' });
    const kids = [gBox, ...ns.map((el) => box.get(el))];
    zoneOf.set(g, hull(kids));
    mine.push(...kids);
    return { gBox, kids };
  };

  if (band.bare) {
    band.columns.forEach((col, ci) => {
      if (ci) y += GAP_GROUP;
      const { gBox } = putCol(-1, ci, col, bx + IND);
      trees.push({ from: bBox, kids: [entry(gBox)] });
      for (const el of notesOf(col)) ancestors.set(el, [groupEl(bi, -1, ci), bEl]);
    });
  } else {
    const laneKids = [];
    band.lanes.forEach((lane, li) => {
      if (li) y += GAP_LANE;
      const lEl = laneEl(bi, li);
      const lx = bx + IND;
      const lBox = place(lEl, lx, y, LANE_W);
      laneKids.push(entry(lBox));
      const laneMine = [lBox];
      y += lBox.h + GAP_DROP;
      const colKids = [];
      lane.columns.forEach((col, ci) => {
        if (ci) y += GAP_GROUP;
        const { gBox, kids } = putCol(li, ci, col, lx + IND);
        colKids.push(entry(gBox));
        laneMine.push(...kids);
        for (const el of notesOf(col)) ancestors.set(el, [groupEl(bi, li, ci), lEl, bEl]);
      });
      trees.push({ from: lBox, kids: colKids });
      const z = hull(laneMine);
      zoneOf.set(lEl, z);
      inner.push({ label: `　${lane.title}`, zone: z });
      mine.push(...laneMine);
    });
    trees.push({ from: bBox, kids: laneKids });
  }
  const zone = hull(mine);
  zoneOf.set(bEl, zone);
  zones.push({ label: band.title, zone }, ...inner);
  y = zone.y2 + GAP_BAND;
});
if (visionEl && bandEntries.length) trees.push({ from: box.get(visionEl), kids: bandEntries });

// ── 連線:骨架是縮排樹的直角線,一條線最長只走一格縮排 ──
const paths = [`<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--wire)"></path></marker>
  <marker id="arrowWait" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--wait)"></path></marker>
  <marker id="arrowLit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--going)"></path></marker>
</defs>`];
const wire = (d) => paths.push(`<path class="tree" d="${d}"></path>`);
// 父卡片垂一條下來,每個子卡片各自從那條橫過來接進自己的左緣;便利貼掛在里程碑右邊,就從右緣垂
for (const t of trees) {
  const kids = t.kids.filter(Boolean);
  if (!t.from || !kids.length) continue;
  const last = kids[kids.length - 1].ey;
  const right = t.side === 'right';
  const sx = right ? t.from.x + t.from.w + GAP_COL / 2 : t.from.x + IND / 2;
  if (right) {
    const y0 = t.from.y + Math.min(STUB, t.from.h / 2);
    wire(`M ${t.from.x + t.from.w} ${y0} H ${sx}`);
    if (last > y0) wire(`M ${sx} ${y0} V ${last}`);
  } else wire(`M ${sx} ${t.from.y + t.from.h} V ${last}`);
  for (const kd of kids) wire(`M ${sx} ${kd.ey} H ${kd.x}`);
}

// ── 引用:一條弧線,從引用者的右緣出去,繞到右邊,再接進被引用那一份的右緣 ──
const contentRight = Math.max(...[...box.values()].map((b) => b.x + b.w));
const outs = new Map();
for (const e of D.edges) outs.set(e.from, (outs.get(e.from) || 0) + 1);
const used = new Map();
for (const e of D.edges) {
  const a = noteEls.get(e.from); const b = noteEls.get(e.to);
  if (!a || !b || !box.get(a) || !box.get(b)) continue;
  const ba = box.get(a); const bb = box.get(b);
  const i = used.get(e.from) || 0; used.set(e.from, i + 1);
  const n = outs.get(e.from);
  // 同一張便利貼出去好幾條就把出口錯開,不然幾條線疊在一起看不出有幾條
  const y1 = Math.round(ba.y + ba.h / 2 + (i - (n - 1) / 2) * 9);
  const y2 = Math.round(bb.y + bb.h / 2);
  const x1 = ba.x + ba.w; const x2 = bb.x + bb.w;
  // 弧度跟著兩份的距離走:離得越遠鼓得越開,線與線才不會黏成一團
  const bulge = Math.min(460, Math.max(70, Math.abs(y2 - y1) * 0.34 + Math.abs(x2 - x1) * 0.2));
  const d = `M ${x1} ${y1} C ${x1 + bulge} ${y1}, ${x2 + bulge} ${y2}, ${x2} ${y2}`;
  const t = byName.get(e.to);
  paths.push(`<path class="ref${t && !t.achieved ? ' blocking' : ''}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${d}"></path>`);
}

// 弧線鼓出去的那一段不算進畫布:它平常沒在畫,算進來只會讓全景永遠縮太小。畫到界外照樣看得見
const totalW = contentRight + 80;
const maxY = Math.max(0, ...[...box.values()].map((b) => b.y + b.h)) + 60;
links.setAttribute('viewBox', `0 0 ${totalW} ${maxY}`);
links.setAttribute('width', totalW);
links.setAttribute('height', maxY);
links.innerHTML = paths.join('');
world.style.width = totalW + 'px';
world.style.height = maxY + 'px';

// ── 相依:目標(或需求)排成先後順序的圖 ──
// 邊全部從引用推出來:綁在目標甲底下的一份引用了綁在目標乙底下的一份,甲就依賴乙。
// 沒被任何里程碑綁的那份(通常是 abstract)自成一張共用卡,不然那條依賴就沒地方落。
const world2 = document.getElementById('world2');
const links2 = document.getElementById('links2');
const DN_W = 300, DAG_LEFT = 40, DAG_TOP = 40, DAG_COL_GAP = 120, DAG_ROW_GAP = 22;
const objById = new Map(D.objectives.map((o) => [o.id, o]));
const reqById = new Map(D.requirements.map((q) => [q.id, q]));
const ownersOf = new Map();   // 文檔 → 綁它的目標
for (const o of D.objectives) for (const m of o.milestones) for (const n of m.binds) {
  if (!ownersOf.has(n)) ownersOf.set(n, new Set());
  ownersOf.get(n).add(o.id);
}
const reqOf = (oid) => { const o = objById.get(oid); return o && o.requirement && reqById.has(o.requirement) ? o.requirement : 'no-req'; };
const reqKey = (rid) => Math.min(5, ...(reqById.has(rid) ? reqById.get(rid).objectives : D.objectives.filter((o) => reqOf(o.id) === 'no-req').map((o) => o.id)).map((oid) => (objById.get(oid) || {}).priority || 5));

function deriveGraph(grain) {
  const byReq = grain === 'requirement';
  const lift = (oid) => (byReq ? reqOf(oid) : oid);
  const nodes = new Map();
  const node = (id) => {
    if (nodes.has(id)) return nodes.get(id);
    let n;
    if (objById.has(id)) {
      const o = objById.get(id);
      n = { id, kind: 'objective', title: o.title, sub: `${reqOf(id) === 'no-req' ? '沒有對到需求' : reqOf(id)} · 優先 ${o.priorityRaw || '(沒填)'}`,
        note: o.note || `里程碑 ${o.milestonesAchieved}/${o.milestones.length} 達成 · Law ${o.law.holds === true ? '成立' : o.law.holds === false ? '未成立' : '未知'}`,
        priority: o.priority || null, tone: o.achieved ? 'done' : o.law.holds === false ? 'stuck' : o.milestones.length ? 'going' : 'idle', achieved: o.achieved };
    } else if (reqById.has(id)) {
      const q = reqById.get(id); const key = reqKey(id);
      n = { id, kind: 'requirement', title: q.title, sub: `需求 · 目標最高優先 ${key === 5 ? '(沒填)' : key}`,
        note: q.note || `Law ${q.law.holds === true ? '成立' : q.law.holds === false ? '未成立' : '未知'} · ${q.objectives.length} 個目標 · 里程碑 ${q.milestonesAchieved}/${q.milestones} 達成`,
        priority: key === 5 ? null : key, tone: q.law.holds === true ? 'done' : q.law.holds === false ? 'stuck' : q.objectives.length ? 'going' : 'idle', achieved: q.law.holds === true };
    } else if (id === 'no-req') {
      const os = D.objectives.filter((o) => reqOf(o.id) === 'no-req'); const key = reqKey(id);
      n = { id, kind: 'requirement', title: '沒有對到需求', sub: `目標的需求欄對不到任何 R-n · 目標最高優先 ${key === 5 ? '(沒填)' : key}`, note: `${os.length} 個目標`,
        priority: key === 5 ? null : key, tone: 'stuck', achieved: false };
    } else {
      const d = byName.get(id);
      n = { id, kind: 'shared', title: d ? d.description : '', sub: `共用 · 沒有綁到任何里程碑`, note: d ? d.state : '', priority: null, tone: d ? tone(d) : 'stuck', achieved: !!(d && d.achieved) };
    }
    n.deps = []; n.dependents = [];
    nodes.set(id, n);
    return n;
  };
  if (byReq) { for (const q of D.requirements) node(q.id); if (D.objectives.some((o) => reqOf(o.id) === 'no-req')) node('no-req'); }
  else for (const o of D.objectives) node(o.id);
  const edges = new Map();
  for (const d of D.docs) {
    const owners = ownersOf.get(d.name);
    if (!owners) continue;
    for (const r of d.refs) {
      const tOwners = ownersOf.get(r);
      const targets = tOwners ? [...new Set([...tOwners].map(lift))] : byName.has(r) ? [r] : [];
      for (const o of owners) for (const t of targets) {
        const a = lift(o);
        if (a === t) continue;
        node(t);
        const key = `${a}>${t}`;
        if (!edges.has(key)) edges.set(key, { from: a, to: t, via: [], inverted: false, cycle: false });
        edges.get(key).via.push(`${d.name} 見 ${r}`);
      }
    }
  }
  for (const e of edges.values()) {
    const a = nodes.get(e.from); const b = nodes.get(e.to);
    e.inverted = a.priority != null && b.priority != null && a.priority < b.priority;
    a.deps.push(e); b.dependents.push(e);
  }
  // 互相依賴:深度優先走一遍,回到還在走的那一個就是繞回去了;那條邊不算進分層,畫成虛線
  const seen = new Map();
  const walk = (id) => {
    seen.set(id, 1);
    for (const e of nodes.get(id).deps) {
      const s = seen.get(e.to);
      if (s === 1) e.cycle = true;
      else if (!s) walk(e.to);
    }
    seen.set(id, 2);
  };
  for (const id of [...nodes.keys()].sort()) if (!seen.has(id)) walk(id);
  return { nodes, edges: [...edges.values()] };
}

const dagBox = new Map();
let views = null;
let dagGraph = deriveGraph('objective');
const dagNodeEls = new Map();
let dagSelected = null;
let dagTotalW = 0, dagMaxY = 0;

function buildDag(grain) {
  dagGraph = deriveGraph(grain);
  dagSelected = null;
  dagNodeEls.clear();
  dagBox.clear();
  const { nodes, edges } = dagGraph;
  world2.querySelectorAll('.dnode').forEach((el) => el.remove());
  world2.insertAdjacentHTML('beforeend', [...nodes.values()].map((n) => `<div class="card dnode" data-kind="dnode" data-kind-of="${n.kind}" data-id="${esc(n.id)}" data-tone="${n.tone}" style="width:${DN_W}px">
    <div class="k">${esc(n.sub)}</div><div class="name">${esc(n.id)}${n.title ? ` ${esc(n.title)}` : ''}</div>
    <div class="n">${esc(n.note)}${n.deps.some((e) => e.inverted) ? ' · <b>優先倒掛</b>' : ''}</div></div>`).join(''));
  for (const el of world2.querySelectorAll('.dnode')) dagNodeEls.set(el.dataset.id, el);

  // 分層:沒有依賴的排第 0 欄,其餘排在它所有依賴的右邊一欄;繞回去的邊不算
  const layer = new Map();
  const depth = (id, trail = new Set()) => {
    if (layer.has(id)) return layer.get(id);
    trail.add(id);
    const ds = nodes.get(id).deps.filter((e) => !e.cycle && !trail.has(e.to));
    const l = ds.length ? 1 + Math.max(...ds.map((e) => depth(e.to, trail))) : 0;
    trail.delete(id);
    layer.set(id, l);
    return l;
  };
  for (const id of nodes.keys()) depth(id);
  const cols = [];
  for (const [id, l] of layer) (cols[l] = cols[l] || []).push(id);
  const byPrio = (a, b) => ((nodes.get(a).priority || 5) - (nodes.get(b).priority || 5)) || a.localeCompare(b);
  for (const c of cols) c.sort(byPrio);
  // 同一欄的順序照它鄰居的重心排幾輪,線才不會交叉成一團
  const pos = new Map();
  const rank = () => cols.forEach((c) => c.forEach((id, i) => pos.set(id, i)));
  const center = (id, side) => {
    const ns = nodes.get(id)[side].map((e) => (side === 'deps' ? e.to : e.from)).filter((n) => pos.has(n));
    return ns.length ? ns.reduce((s, n) => s + pos.get(n), 0) / ns.length : null;
  };
  for (let round = 0; round < 3; round++) {
    for (const side of ['deps', 'dependents']) {
      rank();
      for (const c of cols) {
        const w = new Map(c.map((id, i) => [id, center(id, side) ?? i]));
        c.sort((a, b) => (w.get(a) - w.get(b)) || byPrio(a, b));
      }
    }
  }
  rank();

  const H2 = new Map([...dagNodeEls].map(([id, el]) => [id, el.offsetHeight]));
  const colH = cols.map((c) => c.reduce((s, id) => s + H2.get(id), 0) + Math.max(0, c.length - 1) * DAG_ROW_GAP);
  const tallest = Math.max(0, ...colH);
  cols.forEach((c, ci) => {
    const x = DAG_LEFT + ci * (DN_W + DAG_COL_GAP);
    let y = DAG_TOP + (tallest - colH[ci]) / 2;
    for (const id of c) {
      const el = dagNodeEls.get(id);
      el.style.left = x + 'px'; el.style.top = Math.round(y) + 'px';
      dagBox.set(el, { x, y: Math.round(y), w: DN_W, h: H2.get(id) });
      y += H2.get(id) + DAG_ROW_GAP;
    }
  });

  // 邊:從依賴那一張的右緣出去,接進依賴它那一張的左緣;箭頭指向後做的那一個
  const outs = new Map(); const used = new Map();
  for (const e of edges) outs.set(e.to, (outs.get(e.to) || 0) + 1);
  const ps = [`<defs>
    <marker id="arrow2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--wire)"></path></marker>
    <marker id="arrowStuck2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--stuck)"></path></marker>
    <marker id="arrowLit2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--going)"></path></marker>
  </defs>`];
  for (const e of edges) {
    const a = dagBox.get(dagNodeEls.get(e.to)); const b = dagBox.get(dagNodeEls.get(e.from));
    const i = used.get(e.to) || 0; used.set(e.to, i + 1);
    const y1 = Math.round(a.y + a.h / 2 + (i - (outs.get(e.to) - 1) / 2) * 9);
    const y2 = Math.round(b.y + b.h / 2);
    const x1 = a.x + a.w; const x2 = b.x;
    const bend = Math.max(40, Math.abs(x2 - x1) / 2);
    ps.push(`<path class="dep${e.inverted ? ' inverted' : ''}${e.cycle ? ' cycle' : ''}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}"></path>`);
  }
  dagTotalW = Math.max(0, ...[...dagBox.values()].map((b) => b.x + b.w)) + 60;
  dagMaxY = Math.max(0, ...[...dagBox.values()].map((b) => b.y + b.h)) + 60;
  links2.setAttribute('viewBox', `0 0 ${dagTotalW} ${dagMaxY}`);
  links2.setAttribute('width', dagTotalW);
  links2.setAttribute('height', dagMaxY);
  links2.innerHTML = ps.join('');
  world2.style.width = dagTotalW + 'px';
  world2.style.height = dagMaxY + 'px';
  if (views) { views.dag.box = dagBox; views.dag.totalW = dagTotalW; views.dag.maxY = dagMaxY; }
}
buildDag('objective');

// 側欄首頁的相依段:優先倒掛與互相依賴,照目標那一層算;一條都沒有就整段不出現
{
  const g = deriveGraph('objective');
  const bad = g.edges.filter((e) => e.inverted || e.cycle);
  if (bad.length) {

    document.getElementById('deps').innerHTML = bad.map((e) => `<div class="warn"><b>${e.inverted ? '優先倒掛' : '互相依賴'}:${esc(e.from)} → ${esc(e.to)}</b>${

    }<i>經由 ${esc(e.via.join('、'))}</i></div>`).join('');
  }
}

const canvas = document.getElementById('minimap');
const ctx = canvas.getContext('2d');
const CS = getComputedStyle(document.documentElement);
const cvar = (n) => CS.getPropertyValue(n).trim() || '#888';
const MW = 246, MH = 158;
let ms = 1, mox = 0, moy = 0;
const base = document.createElement('canvas');
let miniDirty = true;
function drawBase(dpr) {
  base.width = MW * dpr; base.height = MH * dpr;
  const b = base.getContext('2d');
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  b.clearRect(0, 0, MW, MH);
  ms = Math.min((MW - 8) / (cur.totalW || 1), (MH - 8) / (cur.maxY || 1));
  mox = (MW - cur.totalW * ms) / 2;
  moy = (MH - cur.maxY * ms) / 2;
  for (const [el, r] of cur.box) {
    const kind = el.dataset.kind;
    b.fillStyle = kind === 'note' || kind === 'dnode' ? cvar('--' + el.dataset.tone) : kind === 'band' ? cvar('--ink') : cvar('--wire');
    b.globalAlpha = kind === 'note' || kind === 'dnode' ? 0.95 : 0.55;
    b.fillRect(mox + r.x * ms, moy + r.y * ms, Math.max(1.5, r.w * ms), Math.max(1.5, r.h * ms));
  }
  b.globalAlpha = 1;
}
function drawMini() {
  if (miniEl.hidden) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (canvas.width !== MW * dpr || miniDirty) { canvas.width = MW * dpr; canvas.height = MH * dpr; drawBase(dpr); miniDirty = false; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, MW, MH);

}
function miniGo(ev) {

}

// ── 平移縮放 ──
let k = 1, tx = 0, ty = 0;
const sideW = () => (asideEl.hidden ? 0 : asideEl.offsetWidth);
// 手在動的時候把畫布交給合成器,手一停就交還:交還了瀏覽器才會用現在這個倍率重畫,字才是清的
let restT = 0;
function moving() { cur.world.style.willChange = 'transform'; clearTimeout(restT); }
function resting() {
  clearTimeout(restT);
  restT = setTimeout(() => { if (!drag) cur.world.style.willChange = 'auto'; }, 140);
}
function apply() {
  document.body.style.setProperty('--sideNow', sideW() + 'px');
  document.body.style.setProperty('--miniH', (miniEl.hidden ? 0 : miniEl.offsetHeight + 12) + 'px');
  cur.world.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
  document.getElementById('zoom').textContent = Math.round(k * 100) + '%';
  drawMini();
  resting();
}
function fit() {
  const r = stage.getBoundingClientRect();
  const pad = 40;
  k = Math.min(2, Math.max(0.04, Math.min((r.width - pad * 2 - sideW()) / (cur.totalW || 1), (r.height - pad * 2) / (cur.maxY || 1))));
  tx = pad + ((r.width - sideW()) - pad * 2 - cur.totalW * k) / 2;
  ty = pad;
  apply();
}
// 一打開停在樹的最上面,寬度剛好:這棵樹是往下長的,一開始就全景只會小到看不見字
function home() {
  const r = stage.getBoundingClientRect();
  const pad = 32;
  k = Math.min(1, Math.max(0.04, (r.width - pad * 2 - sideW()) / (cur.totalW || 1)));
  tx = pad;
  ty = pad;
  apply();
}
function zoomTo(s) {
  const r = stage.getBoundingClientRect();
  const vw = r.width - sideW() - 60;
  const vh = r.height - 60;
  k = Math.min(1.15, Math.max(0.04, Math.min(vw / Math.max(1, s.x2 - s.x1), vh / Math.max(1, s.y2 - s.y1))));
  tx = 30 + (vw - (s.x2 - s.x1) * k) / 2 - s.x1 * k;
  ty = 30 + (vh - (s.y2 - s.y1) * k) / 2 - s.y1 * k;
  apply();
}
function goTo(wx, wy) {
  const r = stage.getBoundingClientRect();
  tx = (r.width - sideW()) / 2 - wx * k;
  ty = r.height / 2 - wy * k;
  apply();
}
function zoomAt(px, py, nk) {
  const next = Math.min(2.5, Math.max(0.04, nk));

  ty = py - (py - ty) * (next / k);

}
stage.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  moving();
  const r = stage.getBoundingClientRect();
  if (ev.ctrlKey || ev.metaKey) zoomAt(ev.clientX - r.left, ev.clientY - r.top, k * (ev.deltaY < 0 ? 1.12 : 0.89));
  else { tx -= ev.deltaX; ty -= ev.deltaY; apply(); }
}, { passive: false });

// 點選認的是「按下去的時候手指底下那張卡片」,不靠瀏覽器發的 click:
// 拖曳要吃 pointermove,而吃了就得指標鎖定,指標鎖定會把 click 的 target 換成整個畫布,
// 那時候 closest('.note') 永遠是 null,點便利貼就一點反應都沒有。
let drag = null, moved = 0, pressed = null;
stage.addEventListener('dragstart', (ev) => ev.preventDefault());
stage.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  moved = 0;
  pressed = ev.target;
  drag = { x: ev.clientX, y: ev.clientY, tx, ty, id: ev.pointerId };
  stage.setPointerCapture(ev.pointerId);
  stage.classList.add('grabbing');
  moving();
});
stage.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.x; const dy = ev.clientY - drag.y;
  moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  tx = drag.tx + dx; ty = drag.ty + dy;
  apply();
});
function letGo(ev) {
  if (!drag) return;
  if (stage.hasPointerCapture(drag.id)) stage.releasePointerCapture(drag.id);
  stage.classList.remove('grabbing');
  drag = null;
  resting();
  // 拖曳歸拖曳、點選歸點選:拖過的那一下不算點到
  if (moved < 5 && pressed) hit(pressed);
  pressed = null;
}
stage.addEventListener('pointerup', letGo);
stage.addEventListener('pointercancel', letGo);

}

// ── 篩選與選取 ──
function related(name) {
  const d = byName.get(name);
  if (!d) return new Set([name]);
  return new Set([name, ...d.refs, ...d.referrers, ...d.blockedBy]);
}
function passes(d) {
  if (!d) return true;
  if (query) {
    const hay = [d.name, d.description, d.state, ...d.modules, ...d.steps.map((x) => x.name)].join(' ').toLowerCase();
    if (!hay.includes(query)) return false;
  }
  if (filter === 'open') return D.lines.openable.some((x) => x.name === d.name) || D.lines.building.some((x) => x.name === d.name);
  if (filter === 'stuck') return d.gaps.length > 0 || d.blockedBy.length > 0;
  if (filter === 'todo') return !d.achieved;
  if (filter === 'warn') return D.warnings.some((w) => w.where === d.name || w.where.startsWith(d.name + '#'));
  return true;
}
function paint() {
  const rel = selected ? related(selected) : null;

  for (const [name, el] of noteEls) {
    const d = byName.get(name);
    const on = (rel ? rel.has(name) : true) && passes(d);
    el.classList.toggle('dim', !on);
    if (name === selected) el.classList.add('sel');
    else if (rel && rel.has(name)) el.classList.add('rel');
  }
  // 選了一份就把它頭上那一串也點亮:一眼看得出它掛在哪個優先度、哪個目標底下

}

function select(name) {

  paint();
  if (name) openDoc(name);
  else { docEl.hidden = true; homeEl.hidden = false; }
}
docEl.addEventListener('click', (ev) => {
  if (ev.target.classList.contains('back')) { if (cur === views.dag) dagSelect(null); else select(null); return; }
  const dg = ev.target.closest('[data-dag]');
  if (dg) { dagSelect(dg.dataset.dag); const el = dagNodeEls.get(dg.dataset.dag); const b = el && dagBox.get(el); if (b) zoomTo({ x1: b.x - 200, y1: b.y - 200, x2: b.x + b.w + 200, y2: b.y + b.h + 200 }); return; }
  const go = ev.target.closest('[data-go]');
  if (go) { if (cur !== views.tree) setView('tree'); select(go.dataset.go); const el = noteEls.get(go.dataset.go); if (el && box.get(el)) zoomTo(zoneOf.get(el) || { x1: box.get(el).x - 200, y1: box.get(el).y - 200, x2: box.get(el).x + box.get(el).w + 200, y2: box.get(el).y + box.get(el).h + 200 }); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === 'Escape') { helpEl.hidden = true; if (cur === views.dag) dagSelect(null); else select(null); }
  if (ev.key === '0') fit();
});

// ── 相依視圖的選取與切換 ──
function dagPaint() {
  const g = dagGraph;
  const n = dagSelected ? g.nodes.get(dagSelected) : null;
  const near = new Set(n ? [dagSelected, ...n.deps.map((e) => e.to), ...n.dependents.map((e) => e.from)] : []);
  // 上下游全部點亮:選一條需求,看得到它牽動整條鏈
  const far = new Set();
  if (n) {
    const go = (id, side) => { for (const e of g.nodes.get(id)[side]) { const t = side === 'deps' ? e.to : e.from; if (!far.has(t)) { far.add(t); go(t, side); } } };
    go(dagSelected, 'deps'); go(dagSelected, 'dependents');
  }
  for (const [id, el] of dagNodeEls) {
    const nd = g.nodes.get(id);
    const hay = `${id} ${nd.title} ${nd.sub}`.toLowerCase();
    el.classList.remove('sel', 'rel', 'path');
    el.classList.toggle('dim', (query && !hay.includes(query)) || (!!n && !near.has(id) && !far.has(id)));
    if (id === dagSelected) el.classList.add('sel');
    else if (near.has(id)) el.classList.add('rel');
    else if (far.has(id)) el.classList.add('path');
  }
  for (const p of links2.querySelectorAll('.dep')) {
    const on = !!n && (p.dataset.from === dagSelected || p.dataset.to === dagSelected);
    p.classList.toggle('lit', on);
    p.classList.toggle('faded', !!n && !on && !(far.has(p.dataset.from) && far.has(p.dataset.to)));
  }
}
const dagLink = (id) => `<button class="jump" data-dag="${esc(id)}">${esc(id)}</button>`;
function openDagNode(id) {
  const n = dagGraph.nodes.get(id);
  homeEl.hidden = true; docEl.hidden = false; asideEl.hidden = false;
  document.getElementById('side').setAttribute('aria-pressed', 'true');
  docEl.scrollTop = 0; asideEl.scrollTop = 0;
  const edgeRow = (e, other) => `<li>${e.inverted ? '<b style="color:var(--stuck)">優先倒掛</b> · ' : ''}${e.cycle ? '互相依賴 · ' : ''}${dagLink(other)}<br><span class="empty">經由 ${esc(e.via.join('、'))}</span></li>`;
  const o = objById.get(id);
  docEl.innerHTML = `
    <button class="back">返回</button>
    <h2>${esc(id)}${n.title ? ` ${esc(n.title)}` : ''}</h2>
    <p class="sub">${esc(n.sub)}</p>
    <p class="sub"><span class="dot" style="background:var(--${n.tone})"></span>${esc(n.note)}</p>
    <section><h3>先要有(它依賴 ${n.deps.length} 個)</h3>${n.deps.length ? `<ul>${n.deps.map((e) => edgeRow(e, e.to)).join('')}</ul>` : '<p class="empty">不依賴任何一個,可以先做</p>'}</section>
    <section><h3>誰等它(${n.dependents.length} 個)</h3>${n.dependents.length ? `<ul>${n.dependents.map((e) => edgeRow(e, e.from)).join('')}</ul>` : '<p class="empty">沒有人等它</p>'}</section>
    ${o ? `<section><h3>里程碑</h3><ul>${o.milestones.map((m) => `<li><span class="dot ${m.achieved ? 'g' : 'n'}"></span>${esc(m.id)} ${esc(m.title)}${m.binds.length ? ` — ${m.binds.map(linkTo).join('、')}` : '(待 claim)'}</li>`).join('')}</ul></section>` : ''}
    ${n.kind === 'requirement' && reqById.has(id) ? `<section><h3>目標</h3><ul>${reqById.get(id).objectives.map((oid) => `<li>${esc(oid)} ${esc((objById.get(oid) || {}).title || '')}</li>`).join('')}</ul></section>` : ''}
    ${n.kind === 'shared' ? `<section><h3>${esc(D.labels.unit)}</h3><p class="sub">${linkTo(id)}</p></section>` : ''}`;
}
function dagSelect(id) {
  dagSelected = id;
  dagPaint();
  if (id) openDagNode(id);
  else { docEl.hidden = true; homeEl.hidden = false; }
}
function setView(name) {
  const next = views[name];
  if (next === cur) return;
  cur.cam = { k, tx, ty };
  cur.world.hidden = true;
  cur = next;
  cur.world.hidden = false;
  document.body.classList.toggle('view-dag', cur === views.dag);
  for (const b of document.querySelectorAll('.bar button[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === name));
  document.getElementById('hint').textContent = cur.hint;
  docEl.hidden = true; homeEl.hidden = false;
  fillJump();
  miniDirty = true;
  if (cur.cam) { ({ k, tx, ty } = cur.cam); apply(); }
  else if (cur === views.dag) fit();
  else home();
}
for (const b of document.querySelectorAll('.bar button[data-view]')) b.addEventListener('click', () => setView(b.dataset.view));
document.getElementById('grain').addEventListener('change', (ev) => {
  buildDag(ev.target.value);
  dagPaint();
  docEl.hidden = true; homeEl.hidden = false;
  miniDirty = true;
  fit();
});

for (const b of document.querySelectorAll('.bar button[data-filter]')) {
  b.addEventListener('click', () => {
    filter = b.dataset.filter;
    for (const o of document.querySelectorAll('.bar button[data-filter]')) o.setAttribute('aria-pressed', String(o === b));
    paint();
  });
}
document.getElementById('q').addEventListener('input', (ev) => { query = ev.target.value.trim().toLowerCase(); paint(); dagPaint(); });
const refmode = document.getElementById('refmode');
const setRefMode = () => { links.setAttribute('class', `refs-${refmode.value}`); };
refmode.addEventListener('change', setRefMode);

setTopHeight();
setRefMode();
paint();
home();
addEventListener('resize', () => { setTopHeight(); home(); });
</script>
</body>
