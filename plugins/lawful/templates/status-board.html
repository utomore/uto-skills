<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>devflow 看板</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f1ea; --panel:#fffdf7; --ink:#23201b; --faint:#6f6a60; --rule:#ddd6c8;
  --paper:#fff8d8; --tape:rgba(0,0,0,.08);
  --done:#2f8f5b; --stuck:#c2453c; --wait:#c98a1d; --going:#3a72c4; --idle:#8b8578;
  --wire:#a39c8c;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1b1a17; --panel:#232120; --ink:#eae6dd; --faint:#9d968a; --rule:#39352f;
    --paper:#3a3526; --tape:rgba(255,255,255,.08); --wire:#6b6455;
    --done:#5fbd85; --stuck:#e2706a; --wait:#e0ab4a; --going:#6ea3e8; --idle:#8b8578;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;}
h1,h2,h3{margin:0;font-weight:600}
a{color:inherit}

header{padding:18px 20px 12px;border-bottom:1px solid var(--rule);background:var(--panel)}
header h1{font-size:17px;letter-spacing:.02em}
.vision{margin-top:4px;color:var(--faint);font-size:13px;max-width:80ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--faint);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.tests{margin-top:8px;font-size:12px;color:var(--faint)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:5;background:var(--panel)}
.bar button{font:inherit;font-size:12px;padding:4px 12px;border:1px solid var(--rule);border-radius:999px;
  background:transparent;color:var(--faint);cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.bar input{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;
  background:transparent;color:inherit;min-width:180px}
.bar .spacer{flex:1}
.legend{display:flex;gap:10px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:baseline}

main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;align-items:start}
#board{position:relative;padding:20px;min-width:0}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#wires path{fill:none;stroke:var(--wire);stroke-width:1.6}
#wires g{opacity:.55}
#wires g.blocking path{stroke:var(--wait)}
#wires g.blocking path.line{stroke-dasharray:5 4}
#wires g.lit{opacity:1}
#wires g.lit path{stroke-width:2.6;stroke:var(--going)}
body.focused #wires g:not(.lit){opacity:.1}

.lane{position:relative;z-index:1;margin-bottom:26px}
.lane>h2{font-size:13px;letter-spacing:.04em;color:var(--faint);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding-bottom:6px;border-bottom:1px dashed var(--rule);margin-bottom:14px}
.lane>h2 b{color:var(--ink);font-size:14px}
.lane>h2 .pri{border:1px solid var(--rule);border-radius:4px;padding:0 6px;font-size:11px}
.cols{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.col{min-width:230px}
.col>h3{font-size:12px;color:var(--faint);margin-bottom:8px;font-weight:500}
.col>h3 b{color:var(--ink);font-weight:600}
.col>h3 .tick{color:var(--done)}
.stack{display:flex;flex-wrap:wrap;gap:14px}

.note{position:relative;z-index:1;width:232px;padding:12px 14px 10px;border-radius:2px;cursor:pointer;
  background:var(--paper);box-shadow:0 5px 12px rgba(0,0,0,.16);
  border-top:4px solid var(--edge);transition:transform .12s ease,box-shadow .12s ease,opacity .18s ease}
.note::after{content:"";position:absolute;top:-7px;left:50%;width:52px;height:14px;transform:translateX(-50%) rotate(-2deg);
  background:var(--tape)}
.note:nth-child(odd){transform:rotate(-.5deg)}
.note:nth-child(even){transform:rotate(.6deg)}
.note:hover{transform:translateY(-3px) rotate(0);box-shadow:0 10px 20px rgba(0,0,0,.22)}
.note[data-tone=done]{--edge:var(--done)}
.note[data-tone=stuck]{--edge:var(--stuck)}
.note[data-tone=wait]{--edge:var(--wait)}
.note[data-tone=going]{--edge:var(--going)}
.note[data-tone=idle]{--edge:var(--idle)}
.note .name{font-weight:600;font-size:13.5px;word-break:break-all}
.note .desc{font-size:12px;color:var(--faint);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .state{font-size:12px;margin-top:7px;color:var(--edge);font-weight:600}
.note .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.note .meta span{font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;color:var(--faint)}
.note .meta span.bad{border-color:var(--stuck);color:var(--stuck)}
.note.ghost{background:transparent;border:1px dashed var(--stuck);border-top-width:4px;color:var(--stuck);box-shadow:none}
.note.ghost::after{display:none}
.note.dim{opacity:.22}
.note.sel{outline:2px solid var(--going);outline-offset:3px}

aside{border-left:1px solid var(--rule);background:var(--panel);padding:18px 16px;position:sticky;top:49px;
  max-height:calc(100vh - 49px);overflow:auto}
aside section{margin-bottom:22px}
aside h3{font-size:12px;letter-spacing:.06em;color:var(--faint);margin-bottom:8px}
aside ol,aside ul{margin:0;padding-left:18px}
aside li{font-size:12.5px;margin-bottom:5px}
aside li code,.note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.warn{border-top:1px solid var(--rule);padding:7px 0;font-size:12px}
.warn b{display:block;color:var(--stuck);font-weight:600}
.warn i{display:block;color:var(--faint);font-style:normal;margin-top:2px}
.empty{color:var(--faint);font-size:12.5px}

#detail{position:fixed;top:0;right:0;width:min(460px,92vw);height:100vh;z-index:20;overflow:auto;
  background:var(--panel);border-left:1px solid var(--rule);box-shadow:-12px 0 30px rgba(0,0,0,.2);padding:18px 20px}
#detail h2{font-size:15px}
#detail .sub{color:var(--faint);font-size:12.5px;margin-top:3px}
#detail .close{position:absolute;top:12px;right:14px;border:1px solid var(--rule);background:transparent;color:var(--faint);
  border-radius:6px;font:inherit;font-size:12px;padding:2px 9px;cursor:pointer}
#detail section{margin-top:18px}
#detail table{width:100%;border-collapse:collapse;font-size:12px}
#detail th{text-align:left;color:var(--faint);font-weight:500;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
#detail td{padding:4px 6px 4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
#detail td.s{white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.g{background:var(--done)} .r{background:var(--stuck)} .y{background:var(--wait)} .n{background:var(--idle)}

@media (max-width:960px){
  main{grid-template-columns:1fr}
  aside{border-left:0;border-top:1px solid var(--rule);position:static;max-height:none}
  #wires{display:none}
}
</style>
</head>
<body>
<header>
  <h1 id="title">devflow 看板</h1>
  <p class="vision" id="vision"></p>
  <div class="chips" id="chips"></div>
  <p class="tests" id="tests"></p>
</header>

<nav class="bar">
  <button data-filter="all" aria-pressed="true">全部</button>
  <button data-filter="open" aria-pressed="false">今天能開</button>
  <button data-filter="stuck" aria-pressed="false">卡住</button>
  <button data-filter="todo" aria-pressed="false">未達成</button>
  <button data-filter="warn" aria-pressed="false">有警訊</button>
  <input id="q" type="search" placeholder="找名字、簽名、模組">
  <span class="spacer"></span>
  <span class="legend">
    <span><i style="background:var(--done)"></i>達成</span>
    <span><i style="background:var(--stuck)"></i>卡住</span>
    <span><i style="background:var(--wait)"></i>等別人</span>
    <span><i style="background:var(--going)"></i>進行中</span>
    <span><i style="background:var(--idle)"></i>draft</span>
  </span>
</nav>

<main>
  <div id="board"><svg id="wires"></svg></div>
  <aside>
    <section>
      <h3>建議路線</h3>
      <ol id="route"></ol>
    </section>
    <section>
      <h3>今天能開幾條線</h3>
      <ul id="lines"></ul>
    </section>
    <section>
      <h3>警訊</h3>
      <div id="warnings"></div>
    </section>
  </aside>
</main>

<div id="detail" hidden></div>

<script id="data" type="application/json">__STATUS_JSON__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const byName = new Map(D.docs.map((d) => [d.name, d]));
const board = document.getElementById('board');
const wires = document.getElementById('wires');
const detail = document.getElementById('detail');
const anchors = new Map();   // 全名 → 第一張便利貼
let selected = null;
let filter = 'all';
let query = '';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tone = (d) => (d.achieved ? 'done' : d.gaps.length ? 'stuck' : d.blockedBy.length ? 'wait' : d.status === 'draft' ? 'idle' : 'going');
const dotOf = (r) => (r === 'green' ? 'g' : r === 'red' ? 'r' : r === '未跑' ? 'y' : 'n');

// 標頭
document.title = `${D.tool} 看板`;
document.getElementById('title').textContent = `${D.tool} 看板`;
const vision = document.getElementById('vision');
vision.textContent = D.vision ? `願景:${D.vision}` : '願景還沒訂,或還是模板';
document.getElementById('chips').innerHTML = D.headline
  .map((c) => `<span class="chip">${esc(c.label)} <b>${esc(c.value)}</b></span>`).join('');
document.getElementById('tests').textContent = `· ${D.tests}`;

// 側欄
const route = document.getElementById('route');
if (D.route.steps.length) route.innerHTML = D.route.steps.map((t) => `<li>${esc(t)}</li>`).join('');
else route.outerHTML = `<p class="empty" id="route">${esc(D.route.note || '')}</p>`;

const lines = document.getElementById('lines');
const lineItems = [
  ...D.lines.openable.map((x) => `<li><b>${esc(x.name)}</b><br><span class="empty">${esc(x.tag)}</span></li>`),
  ...D.lines.building.map((x) => `<li><b>${esc(x.name)}</b><br><span class="empty">建構中,分支 build/${esc(x.name)}</span></li>`),
  ...D.lines.shared.map((x) => `<li class="empty">${esc(x.a)} 與 ${esc(x.b)} 的 step 都住 ${x.files.map((f) => `<code>${esc(f)}</code>`).join('、')},可以同時開</li>`),
];
lines.innerHTML = lineItems.length ? lineItems.join('') : '<li class="empty">一條都開不了</li>';

document.getElementById('warnings').innerHTML = D.warnings.length
  ? D.warnings.map((w) => `<div class="warn"><b>${esc(w.where)}</b>${esc(w.what)}<i>${esc(w.fix)}</i></div>`).join('')
  : '<p class="empty">無</p>';

// 便利貼
function noteHtml(name) {
  const d = byName.get(name);
  if (!d) return `<div class="note ghost" data-tone="stuck" data-name="${esc(name)}"><div class="name">${esc(name)}</div><div class="state">綁定了,features/ 沒有這個檔</div></div>`;
  const law = d.laws.total ? `law ${d.laws.green === null ? 'nan' : d.laws.green}/${d.laws.total}` : 'law 0 條';
  const meta = [
    `<span>${esc(d.status || '沒有 status')}</span>`,
    `<span>簽名 ${d.signatures.matched}/${d.signatures.total}</span>`,
    `<span${d.laws.green !== null && d.laws.green < d.laws.total ? ' class="bad"' : ''}>${esc(law)}</span>`,
    d.signatures.stub ? `<span class="bad">骨架 ${d.signatures.stub}</span>` : '',
    d.revisions.count ? `<span>REV ${d.revisions.count}</span>` : '',
    d.building ? '<span>建構中</span>' : '',
  ].filter(Boolean).join('');
  return `<div class="note" data-tone="${tone(d)}" data-name="${esc(d.name)}">
    <div class="name">${esc(d.name)}</div>
    <div class="desc">${esc(d.description)}</div>
    <div class="state">${esc(d.state)}</div>
    <div class="meta">${meta}</div>
  </div>`;
}

const laneHtml = D.lanes.map((lane) => {
  const cols = lane.columns.map((c) => `<div class="col">
    <h3><b>${esc(c.title)}</b>${c.achieved ? ' <span class="tick">達成</span>' : ''}</h3>
    <div class="stack">${c.docs.map(noteHtml).join('')}</div></div>`).join('');
  return `<div class="lane">
    <h2>${lane.badge ? `<span class="pri">${esc(lane.badge)}</span> ` : ''}<b>${esc(lane.title)}</b>
      ${lane.notes.map((n) => `<span>${esc(n)}</span>`).join('')}</h2>
    <div class="cols">${lane.empty ? `<p class="empty">${esc(lane.empty)}</p>` : cols}</div></div>`;
});
if (!D.docs.length) laneHtml.push(`<p class="empty">還沒有任何${esc(D.labels.unit)}</p>`);
board.insertAdjacentHTML('beforeend', laneHtml.join(''));

for (const el of board.querySelectorAll('.note')) {
  const n = el.dataset.name;
  if (!anchors.has(n)) anchors.set(n, el);
}

// 連線:誰引用誰,箭頭指向被引用的那一張
function drawWires() {
  const b = board.getBoundingClientRect();
  wires.setAttribute('viewBox', `0 0 ${board.scrollWidth} ${board.scrollHeight}`);
  wires.setAttribute('width', board.scrollWidth);
  wires.setAttribute('height', board.scrollHeight);
  const at = (name) => {
    const el = anchors.get(name);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const left = r.left - b.left; const top = r.top - b.top;
    return { left, top, right: left + r.width, bottom: top + r.height, cx: left + r.width / 2, cy: top + r.height / 2 };
  };
  // 被引用的那張在下面就直接往下接,在上面就往上接,在同一排就從底下繞過去,不穿過中間的便利貼。
  // 箭頭畫在終點,指的是「引用了誰」
  const UP = [[-4, 7], [0, 0], [4, 7]];
  const route = (f, t) => {
    if (t.top - f.bottom > 8) return { x1: f.cx, y1: f.bottom, x2: t.cx, y2: t.top, head: [[-4, -7], [0, 0], [4, -7]] };
    if (f.top - t.bottom > 8) return { x1: f.cx, y1: f.top, x2: t.cx, y2: t.bottom, head: UP };
    const dip = Math.max(f.bottom, t.bottom) + 26;
    return { x1: f.cx, y1: f.bottom, x2: t.cx, y2: t.bottom, dip, head: UP };
  };
  const out = [];
  for (const e of D.edges) {
    const f = at(e.from); const t = at(e.to);
    if (!f || !t) continue;
    const r = route(f, t);
    const line = r.dip
      ? `M ${r.x1} ${r.y1} C ${r.x1} ${r.dip}, ${r.x2} ${r.dip}, ${r.x2} ${r.y2}`
      : `M ${r.x1} ${r.y1} C ${r.x1} ${(r.y1 + r.y2) / 2}, ${r.x2} ${(r.y1 + r.y2) / 2}, ${r.x2} ${r.y2}`;
    const head = r.head.map(([dx, dy], i) => `${i ? 'L' : 'M'} ${r.x2 + dx} ${r.y2 + dy}`).join(' ');
    const target = byName.get(e.to);
    const cls = target && !target.achieved ? 'blocking' : '';
    out.push(`<g class="${cls}" data-from="${e.from}" data-to="${e.to}">
      <path class="line" d="${line}"></path><path class="head" d="${head}"></path></g>`);
  }
  wires.innerHTML = out.join('');
  paint();
}

// 篩選與選取
function related(name) {
  const d = byName.get(name);
  if (!d) return new Set([name]);
  return new Set([name, ...d.refs, ...d.referrers, ...d.blockedBy]);
}

function passes(d) {
  if (!d) return true;
  if (query) {
    const hay = [d.name, d.description, d.state, ...d.modules, ...d.steps.map((x) => x.name)].join(' ').toLowerCase();
    if (!hay.includes(query)) return false;
  }
  if (filter === 'open') return D.lines.openable.some((x) => x.name === d.name) || D.lines.building.some((x) => x.name === d.name);
  if (filter === 'stuck') return d.gaps.length > 0 || d.blockedBy.length > 0;
  if (filter === 'todo') return !d.achieved;
  if (filter === 'warn') return D.warnings.some((w) => w.where === d.name || w.where.startsWith(d.name + '#'));
  return true;
}

function paint() {
  const rel = selected ? related(selected) : null;
  document.body.classList.toggle('focused', !!selected);
  for (const el of board.querySelectorAll('.note')) {
    const n = el.dataset.name;
    const d = byName.get(n);
    const on = (rel ? rel.has(n) : true) && passes(d);
    el.classList.toggle('dim', !on);
    el.classList.toggle('sel', n === selected);
  }
  for (const g of wires.querySelectorAll('g')) {
    g.classList.toggle('lit', !!selected && (g.dataset.from === selected || g.dataset.to === selected));
  }
}

function stepRows(d) {
  if (!d.steps.length) return '<tr><td colspan="3" class="empty">沒有任何 step</td></tr>';
  return d.steps.map((x) => `<tr>
    <td class="s">${esc(x.index)}${x.ref ? ` 見 ${esc(x.ref)}` : ''}</td>
    <td><code>${esc(x.signature)}</code><br><span class="empty">${esc(x.module)} · ${esc(x.layer)}${x.at && x.at !== x.module ? ` → 實際在 ${esc(x.at)}` : ''}</span></td>
    <td class="s">${esc(x.state)}</td></tr>`).join('');
}

function openDetail(name) {
  const d = byName.get(name);
  if (!d) return;
  const warns = D.warnings.filter((w) => w.where === name || w.where.startsWith(name + '#'));
  detail.innerHTML = `
    <button class="close">關閉</button>
    <h2>${esc(d.name)}</h2>
    <p class="sub">${esc(d.kind)} · ${esc(d.status || '沒有 status')} · ${esc(d.state)}${d.objective ? ` · ${esc(d.objective)} 優先 ${esc(d.priority ?? '?')} · ${esc(d.milestone)}` : ' · 沒有綁到任何目標'}</p>
    <p class="sub">${esc(d.description)}</p>
    <section><h3>${esc(D.labels.steps)}(簽名 ${d.signatures.matched}/${d.signatures.total} 對到,骨架 ${d.signatures.stub}${d.observations.total ? ` · 觀察點 ${d.observations.matched}/${d.observations.total}` : ''})</h3>
      <table><thead><tr><th>列</th><th>簽名 / 模組</th><th>狀態</th></tr></thead><tbody>${stepRows(d)}</tbody></table></section>
    <section><h3>Laws(通過 ${d.laws.green === null ? 'nan' : d.laws.green} / ${d.laws.total},翻成測試 ${d.laws.traced})</h3>
      ${d.laws.total ? `<ul>${d.laws.items.map((l) => `<li><span class="dot ${dotOf(l.result)}"></span>${esc(l.id)} [${esc(l.kind)}] ${esc(l.title)} — ${esc(l.result)}</li>`).join('')}</ul>` : '<p class="empty">一條 law 都沒寫</p>'}</section>
    ${d.examples.total ? `<section><h3>Examples</h3><ul>${d.examples.items.map((e) => `<li><span class="dot ${dotOf(e.result)}"></span>${esc(e.id)} 覆蓋 ${esc(e.covers.join('、'))} — ${esc(e.result)}</li>`).join('')}</ul></section>` : ''}
    <section><h3>關係</h3><ul>
      <li>引用了:${d.refs.length ? d.refs.map(esc).join('、') : '無'}</li>
      <li>被引用:${d.referrers.length ? d.referrers.map(esc).join('、') : '無'}</li>
      <li>等誰:${d.blockedBy.length ? d.blockedBy.map(esc).join('、') : '無'}</li>
      <li>住哪裡:${d.modules.length ? d.modules.map((m) => `<code>${esc(m)}</code>`).join('、') : '無'}</li>
    </ul></section>
    ${d.gaps.length ? `<section><h3>GAP</h3><ul>${d.gaps.map((g) => `<li>${esc(g)}</li>`).join('')}</ul></section>` : ''}
    ${warns.length ? `<section><h3>警訊</h3>${warns.map((w) => `<div class="warn"><b>${esc(w.where)}</b>${esc(w.what)}<i>${esc(w.fix)}</i></div>`).join('')}</section>` : ''}
    ${d.revisions.count ? `<section><h3>修訂</h3><p class="sub">REV ${d.revisions.count} 條,最後一條:${esc(d.revisions.last || '')}</p></section>` : ''}`;
  detail.hidden = false;
  detail.scrollTop = 0;
}

function select(name) {
  selected = name;
  paint();
  if (name) openDetail(name); else detail.hidden = true;
}

board.addEventListener('click', (ev) => {
  const el = ev.target.closest('.note');
  if (!el) { select(null); return; }
  select(el.dataset.name === selected ? null : el.dataset.name);
});
detail.addEventListener('click', (ev) => { if (ev.target.classList.contains('close')) select(null); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') select(null); });

for (const b of document.querySelectorAll('.bar button')) {
  b.addEventListener('click', () => {
    filter = b.dataset.filter;
    for (const o of document.querySelectorAll('.bar button')) o.setAttribute('aria-pressed', String(o === b));
    paint();
  });
}
document.getElementById('q').addEventListener('input', (ev) => { query = ev.target.value.trim().toLowerCase(); paint(); });

drawWires();
addEventListener('resize', drawWires);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWires);
</script>
