<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看板</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#eeeae1; --panel:#fffdf7; --ink:#23201b; --faint:#6f6a60; --rule:#ddd6c8;
  --paper:#fff8d8; --tape:rgba(0,0,0,.08); --grid:rgba(0,0,0,.055);
  --done:#2f8f5b; --stuck:#c2453c; --wait:#c98a1d; --going:#3a72c4; --idle:#8b8578;
  --wire:#a39c8c; --sideW:360px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161513; --panel:#232120; --ink:#eae6dd; --faint:#9d968a; --rule:#39352f;
    --paper:#3a3526; --tape:rgba(255,255,255,.08); --grid:rgba(255,255,255,.05); --wire:#6b6455;
    --done:#5fbd85; --stuck:#e2706a; --wait:#e0ab4a; --going:#6ea3e8; --idle:#8b8578;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;}
h1,h2,h3{margin:0;font-weight:600}

/* 上方:一行標頭 + 一行工具列,其餘全給畫布 */
#top{position:relative;z-index:10;background:var(--panel);border-bottom:1px solid var(--rule)}
#head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 16px 0}
#head h1{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--faint);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
#tests{font-size:12px;color:var(--faint);padding:2px 16px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px}
.bar button,.bar select{font:inherit;font-size:12px;padding:4px 11px;border:1px solid var(--rule);border-radius:999px;
  background:transparent;color:var(--faint);cursor:pointer}
.bar select{border-radius:6px;padding:4px 6px}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.bar input{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;
  background:transparent;color:inherit;min-width:170px}
.bar .sep{width:1px;height:18px;background:var(--rule)}
.bar .spacer{flex:1}
.bar label{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px}
#zoom{font-size:12px;color:var(--faint);min-width:44px;text-align:center}
.legend{display:flex;gap:9px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.legend span{cursor:help}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}

/* 畫布:平移縮放的無限平面 */
#stage{position:absolute;inset:0;top:var(--topH,108px);overflow:hidden;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:26px 26px}
#stage.grabbing{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;user-select:none}
#links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#links path{fill:none}
#links .tree{stroke:var(--wire);stroke-width:1.6;opacity:.5}
#links .ref{stroke:var(--wire);stroke-width:1.4;opacity:.45;stroke-dasharray:6 5;marker-end:url(#arrow)}
#links .ref.blocking{stroke:var(--wait);opacity:.6;marker-end:url(#arrowWait)}
#links .lit{stroke:var(--going);stroke-width:2.4;opacity:1;stroke-dasharray:none;marker-end:url(#arrowLit)}
#links.refs-off .ref{display:none}
#links.refs-sel .ref:not(.lit){display:none}

.card{position:absolute;border-radius:3px;padding:12px 14px}
.dim{opacity:.13}
.card.sel{outline:2px solid var(--going);outline-offset:3px}
.card.rel{outline:2px dashed var(--going);outline-offset:3px}
.card.path{outline:1px solid var(--going);outline-offset:2px}

/* 根:願景 */
.vision{background:var(--panel);border:1px solid var(--rule);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.vision h2{font-size:13px;color:var(--faint);letter-spacing:.08em;font-weight:500}
.vision p{margin:6px 0 0;font-size:13.5px;line-height:1.75}
.vision p.none{color:var(--stuck)}

/* 優先度區塊的標籤 */
.band{background:var(--ink);color:var(--panel);border:1px solid var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.14)}
.band .t{font-size:14px;font-weight:700;letter-spacing:.04em}
.band .n{font-size:11.5px;margin-top:4px;opacity:.72;line-height:1.5}
.band[data-done=y]{background:var(--done);border-color:var(--done)}

/* 目標 / 里程碑 */
.lane,.group{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--edge, var(--rule));
  box-shadow:0 3px 10px rgba(0,0,0,.08)}
.lane[data-done=y],.group[data-done=y]{--edge:var(--done)}
.lane[data-done=n],.group[data-done=n]{--edge:var(--going)}
.lane .t,.group .t{font-size:13.5px;font-weight:600;line-height:1.5}
.lane .n,.group .n{font-size:12px;color:var(--faint);margin-top:4px}
.group .t{font-size:13px}

/* 便利貼 */
.note{background:var(--paper);box-shadow:0 5px 12px rgba(0,0,0,.16);border-top:4px solid var(--edge);
  cursor:pointer;padding:11px 13px 9px;transition:box-shadow .12s ease,opacity .18s ease}
.note::after{content:"";position:absolute;top:-7px;left:50%;width:50px;height:13px;
  transform:translateX(-50%) rotate(-2deg);background:var(--tape)}
.note:hover{box-shadow:0 10px 22px rgba(0,0,0,.24)}
.note[data-tone=done]{--edge:var(--done)}
.note[data-tone=stuck]{--edge:var(--stuck)}
.note[data-tone=wait]{--edge:var(--wait)}
.note[data-tone=going]{--edge:var(--going)}
.note[data-tone=idle]{--edge:var(--idle)}
.note .name{font-weight:600;font-size:13.5px;word-break:break-all}
.note .desc{font-size:12px;color:var(--faint);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .state{font-size:12px;margin-top:6px;color:var(--edge);font-weight:600}
.note .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.note .meta span{font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;color:var(--faint)}
.note .meta span.bad{border-color:var(--stuck);color:var(--stuck)}
.note.ghost{background:transparent;border:1px dashed var(--stuck);border-top-width:4px;color:var(--stuck);box-shadow:none}
.note.ghost::after{display:none}

/* 右邊那一欄:沒選東西時是派工,選了便利貼就換成那一份的細節 */
aside{position:absolute;right:0;top:var(--topH,108px);bottom:0;width:var(--sideW);z-index:8;overflow:auto;
  background:var(--panel);border-left:1px solid var(--rule);padding:16px 14px}
aside[hidden]{display:none}
aside section{margin-bottom:20px}
aside h3{font-size:12px;letter-spacing:.06em;color:var(--faint);margin-bottom:8px}
aside ol,aside ul{margin:0;padding-left:18px}
aside li{font-size:12.5px;margin-bottom:5px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.warn{border-top:1px solid var(--rule);padding:7px 0;font-size:12px}
.warn b{display:block;color:var(--stuck);font-weight:600}
.warn i{display:block;color:var(--faint);font-style:normal;margin-top:2px}
.empty{color:var(--faint);font-size:12.5px}
#doc h2{font-size:15px;padding-right:56px}
#doc .sub{color:var(--faint);font-size:12.5px;margin-top:3px}
#doc .back{position:absolute;top:12px;right:14px;border:1px solid var(--rule);background:transparent;
  color:var(--faint);border-radius:6px;font:inherit;font-size:12px;padding:2px 9px;cursor:pointer}
#doc section{margin-top:16px}
#doc table{width:100%;border-collapse:collapse;font-size:12px}
#doc th{text-align:left;color:var(--faint);font-weight:500;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
#doc td{padding:4px 6px 4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
#doc td.s{white-space:nowrap}
#doc .jump{background:none;border:0;padding:0;font:inherit;color:var(--going);cursor:pointer;text-decoration:underline}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.g{background:var(--done)} .dot.r{background:var(--stuck)} .dot.y{background:var(--wait)} .dot.n{background:var(--idle)}

/* 小地圖 */
#mini{position:absolute;left:14px;bottom:44px;z-index:9;background:var(--panel);border:1px solid var(--rule);
  border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.16);padding:7px 8px 8px;width:262px}
#mini[hidden]{display:none}
#minihead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#minihead b{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.05em}
#jump{flex:1;min-width:0;font:inherit;font-size:11.5px;padding:2px 4px;border:1px solid var(--rule);
  border-radius:5px;background:transparent;color:var(--faint);cursor:pointer}
#minimap{display:block;width:246px;height:158px;cursor:crosshair;border-radius:4px;background:var(--bg)}

#help{position:absolute;right:calc(var(--sideW) + 16px);top:calc(var(--topH,108px) + 12px);z-index:14;width:min(430px,88vw);
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:14px 16px}
#help[hidden]{display:none}
#help h3{margin-bottom:10px}
#help dl{margin:0}
#help dt{font-size:12.5px;font-weight:600;margin-top:9px}
#help dt i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
#help dd{margin:2px 0 0;font-size:12px;color:var(--faint);line-height:1.65}
#help .close{position:absolute;top:10px;right:12px;border:1px solid var(--rule);background:transparent;
  color:var(--faint);border-radius:6px;font:inherit;font-size:12px;padding:2px 9px;cursor:pointer}
#hint{position:absolute;left:14px;bottom:12px;z-index:8;font-size:12px;color:var(--faint);
  background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:3px 12px;opacity:.9}
</style>
</head>
<body>
<div id="top">
  <div id="head"><h1 id="title">看板</h1><div class="chips" id="chips"></div></div>
  <div id="tests"></div>
  <div class="bar">
    <button data-filter="all" aria-pressed="true">全部</button>
    <button data-filter="open" aria-pressed="false">今天能開</button>
    <button data-filter="stuck" aria-pressed="false">卡住</button>
    <button data-filter="todo" aria-pressed="false">未達成</button>
    <button data-filter="warn" aria-pressed="false">有警訊</button>
    <input id="q" type="search" placeholder="找名字、簽名、模組">
    <span class="sep"></span>
    <label>引用連線
      <select id="refmode">
        <option value="all" selected>全部顯示</option>
        <option value="sel">只有選取的</option>
        <option value="off">不顯示</option>
      </select>
    </label>
    <span class="sep"></span>
    <button id="zoomout">−</button><span id="zoom">100%</span><button id="zoomin">＋</button>
    <button id="fit">符合畫面</button>
    <button id="minitoggle" aria-pressed="true">小地圖</button>
    <button id="side" aria-pressed="true">側欄</button>
    <button id="helpbtn">顏色是什麼意思</button>
    <span class="spacer"></span>
    <span class="legend" id="legend"></span>
  </div>
</div>

<div id="stage"><div id="world"><svg id="links"></svg></div></div>

<div id="mini">
  <div id="minihead"><b>小地圖</b><select id="jump"></select></div>
  <canvas id="minimap"></canvas>
</div>
<div id="hint">拖曳平移 · 滾輪上下、Ctrl 滾輪縮放 · 點便利貼看細節 · 點區塊、目標或里程碑縮放到那一叢 · 0 回到全景</div>

<aside id="aside">
  <div id="home">
    <section><h3>建議路線</h3><div id="route"></div></section>
    <section><h3>今天能開幾條線</h3><ul id="lines"></ul></section>
    <section><h3>警訊</h3><div id="warnings"></div></section>
  </div>
  <div id="doc" hidden></div>
</aside>

<div id="help" hidden></div>

<script id="data" type="application/json">__STATUS_JSON__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const byName = new Map(D.docs.map((d) => [d.name, d]));
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const links = document.getElementById('links');
const asideEl = document.getElementById('aside');
const homeEl = document.getElementById('home');
const docEl = document.getElementById('doc');
const miniEl = document.getElementById('mini');
const helpEl = document.getElementById('help');
let selected = null;
let filter = 'all';
let query = '';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tone = (d) => (d.achieved ? 'done' : d.gaps.length ? 'stuck' : d.blockedBy.length ? 'wait' : d.status === 'draft' ? 'idle' : 'going');
const dotOf = (r) => (r === 'green' ? 'g' : r === 'red' ? 'r' : r === '未跑' ? 'y' : 'n');

// 便利貼的五個顏色各是什麼判定出來的:圖例、說明面板與細節面板講的是同一句
const TERMS = [
  ['done', '達成', `簽名全部對得上、一個骨架都不剩、laws 與 examples 全綠、沒有還開著的 GAP,而且它引用的${D.labels.unit}也都達成`],
  ['stuck', '卡住', '有還開著的 GAP。GAP 是 qa 或 impl 寫不下去時開的問題,等的是一個決定;回答之前這一份誰都推不動'],
  ['wait', '等別人', `它引用的${D.labels.unit}還沒達成。等的是別份${D.labels.unit}把自己做完,不是等人回答;那一份達成了這一份才輪得到`],
  ['going', '進行中', `契約已經 ready,沒有 GAP 也沒有在等別人,只是還沒全綠——${D.labels.steps}、測試或實作還缺東西。今天就能派`],
  ['idle', 'draft', '契約還是 draft:規格還沒定案,還不能派測試也還不能派實作'],
];

// 標頭
document.title = `${D.tool} 看板`;
document.getElementById('title').textContent = `${D.tool} 看板`;
document.getElementById('chips').innerHTML = D.headline
  .map((c) => `<span class="chip">${esc(c.label)} <b>${esc(c.value)}</b></span>`).join('');
document.getElementById('tests').textContent = `${D.tests} ·`;
document.getElementById('legend').innerHTML = TERMS
  .map(([t, name, why]) => `<span title="${esc(why)}"><i style="background:var(--${t})"></i>${esc(name)}</span>`).join('')
  + '<span title="虛線箭頭:箭頭那一端是被引用的那一份"><i style="background:var(--wire)"></i>引用</span>';
helpEl.innerHTML = `<button class="close">關閉</button><h3>便利貼的顏色</h3><dl>${
  TERMS.map(([t, name, why]) => `<dt><i style="background:var(--${t})"></i>${esc(name)}</dt><dd>${esc(why)}</dd>`).join('')
}<dt><i style="background:var(--wire)"></i>虛線箭頭</dt><dd>引用:箭頭那一端是被引用的那一份。實線是樹的骨架(願景 → 優先度區塊 → 目標 → 里程碑 → ${esc(D.labels.unit)})</dd></dl>`;
const setTopHeight = () => document.body.style.setProperty('--topH', document.getElementById('top').offsetHeight + 'px');

// 側欄的首頁:派工
document.getElementById('route').innerHTML = D.route.steps.length
  ? `<ol>${D.route.steps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>`
  : `<p class="empty">${esc(D.route.note || '')}</p>`;
const lineItems = [
  ...D.lines.openable.map((x) => `<li><b>${esc(x.name)}</b><br><span class="empty">${esc(x.tag)}</span></li>`),
  ...D.lines.building.map((x) => `<li><b>${esc(x.name)}</b><br><span class="empty">建構中,分支 build/${esc(x.name)}</span></li>`),
  ...D.lines.shared.map((x) => `<li class="empty">${esc(x.a)} 與 ${esc(x.b)} 的 ${esc(D.labels.steps)} 都住 ${x.files.map((f) => `<code>${esc(f)}</code>`).join('、')},可以同時開</li>`),
];
document.getElementById('lines').innerHTML = lineItems.length ? lineItems.join('') : '<li class="empty">一條都開不了</li>';
document.getElementById('warnings').innerHTML = D.warnings.length
  ? D.warnings.map((w) => `<div class="warn"><b>${esc(w.where)}</b>${esc(w.what)}<i>${esc(w.fix)}</i></div>`).join('')
  : '<p class="empty">無</p>';

// ── 這棵樹:願景 → 優先度區塊 → 目標 → 里程碑 → 一份文檔一張便利貼 ──
const NOTE_W = 236, GROUP_W = 236, LANE_W = 300, BAND_W = 208, VISION_W = 660;
const GAP_NOTE = 16;      // 同一條里程碑底下,便利貼之間
const GAP_GROUP = 30;     // 里程碑之間
const GAP_LANE = 64;      // 目標之間
const GAP_ROW = 62;       // 層與層之間
const GAP_SHELF = 76;     // 同一個區塊裡,折行之後的兩排之間
const GAP_BAND = 118;     // 區塊之間
const MAX_SHELF = 4200;   // 一排最寬到這裡就折行
const LEFT = 112;         // 願景的左緣,也是整張圖的最左邊
const TRUNK = 150;        // 願景底下垂直落下的主幹,落點就在願景卡片底下
const BAND_X = 202;       // 區塊標籤的左緣
const SPINE = 36;         // 區塊標籤右邊的支幹

function noteHtml(name) {
  const d = byName.get(name);
  if (!d) return `<div class="card note ghost" data-kind="note" data-name="${esc(name)}" data-tone="stuck"><div class="name">${esc(name)}</div><div class="state">綁定了,${esc(D.labels.unit)}裡沒有這一份</div></div>`;
  const law = d.laws.total ? `law ${d.laws.green === null ? 'nan' : d.laws.green}/${d.laws.total}` : 'law 0 條';
  const meta = [
    `<span>${esc(d.status || '沒有 status')}</span>`,
    `<span>簽名 ${d.signatures.matched}/${d.signatures.total}</span>`,
    `<span${d.laws.green !== null && d.laws.green < d.laws.total ? ' class="bad"' : ''}>${esc(law)}</span>`,
    d.signatures.stub ? `<span class="bad">骨架 ${d.signatures.stub}</span>` : '',
    d.revisions.count ? `<span>REV ${d.revisions.count}</span>` : '',
    d.building ? '<span>建構中</span>' : '',
  ].filter(Boolean).join('');
  return `<div class="card note" data-kind="note" data-name="${esc(d.name)}" data-tone="${tone(d)}">
    <div class="name">${esc(d.name)}</div>
    <div class="desc">${esc(d.description)}</div>
    <div class="state">${esc(d.state)}</div>
    <div class="meta">${meta}</div></div>`;
}

// 先把每張牌放進畫布量高度,再算位置:內容多高就佔多高,不猜
const html = [];
html.push(`<div class="card vision" data-kind="vision" style="width:${VISION_W}px"><h2>願景</h2>${
  D.vision ? `<p>${esc(D.vision)}</p>` : '<p class="none">還沒訂,或還是模板</p>'}</div>`);
const drawn = new Set();   // 一份文檔綁到兩條里程碑也只畫一張,第一條里程碑收著它
D.bands.forEach((band, bi) => {
  html.push(`<div class="card band" data-kind="band" data-band="${bi}" data-done="${band.achieved ? 'y' : 'n'}" style="width:${BAND_W}px">
    <div class="t">${esc(band.title)}</div><div class="n">${esc(band.note)}</div></div>`);
  const columns = [];
  if (band.bare) band.columns.forEach((col, ci) => columns.push([-1, ci, col]));
  else band.lanes.forEach((lane, li) => {
    html.push(`<div class="card lane" data-kind="lane" data-band="${bi}" data-lane="${li}" data-done="${lane.achieved ? 'y' : 'n'}" style="width:${LANE_W}px">
      <div class="t">${esc(lane.title)}</div>
      ${lane.notes.map((n) => `<div class="n">${esc(n)}</div>`).join('')}
      ${lane.empty ? `<div class="n">${esc(lane.empty)}</div>` : ''}</div>`);
    lane.columns.forEach((col, ci) => columns.push([li, ci, col]));
  });
  for (const [li, ci, col] of columns) {
    col.own = col.docs.filter((n) => !drawn.has(n) && (drawn.add(n), true));
    html.push(`<div class="card group" data-kind="group" data-band="${bi}" data-lane="${li}" data-col="${ci}" data-done="${col.achieved ? 'y' : 'n'}" style="width:${GROUP_W}px">
      <div class="t">${esc(col.title)}</div>
      <div class="n">${col.docs.length} ${esc(D.labels.unit)}${col.achieved ? ' · 達成' : ''}</div></div>`);
    for (const name of col.own) html.push(noteHtml(name));
  }
});
world.insertAdjacentHTML('beforeend', html.join(''));

const cards = [...world.querySelectorAll('.card')];
for (const el of cards) if (!el.style.width) el.style.width = NOTE_W + 'px';
const H = new Map(cards.map((el) => [el, el.offsetHeight]));
const noteEls = new Map();
for (const el of cards) if (el.dataset.kind === 'note') noteEls.set(el.dataset.name, el);
const box = new Map();       // 元素 → {x,y,w,h}
const pick = (sel) => world.querySelector(sel);
const bandEl = (bi) => pick(`.band[data-band="${bi}"]`);
const laneEl = (bi, li) => pick(`.lane[data-band="${bi}"][data-lane="${li}"]`);
const groupEl = (bi, li, ci) => pick(`.group[data-band="${bi}"][data-lane="${li}"][data-col="${ci}"]`);
function place(el, x, y, w) {
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  const b = { x, y, w, h: H.get(el) };
  box.set(el, b);
  return b;
}
// 每層都置中在它的子節點上:線才會從卡片正下方出去、從卡片正上方進來
const midOf = (xs, fallback) => (xs.length ? (Math.min(...xs) + Math.max(...xs)) / 2 : fallback);
const hull = (boxes) => ({
  x1: Math.min(...boxes.map((b) => b.x)), y1: Math.min(...boxes.map((b) => b.y)),
  x2: Math.max(...boxes.map((b) => b.x + b.w)), y2: Math.max(...boxes.map((b) => b.y + b.h)),
});

const visionEl = pick('.vision');
const laneRowH = Math.max(0, ...[...world.querySelectorAll('.lane')].map((el) => H.get(el)));
const groupRowH = Math.max(0, ...[...world.querySelectorAll('.group')].map((el) => H.get(el)));
const notesOf = (col) => col.own.map((n) => noteEls.get(n)).filter(Boolean);
const colWidth = (col) => {
  const n = notesOf(col).length;
  return Math.max(GROUP_W, n ? n * NOTE_W + (n - 1) * GAP_NOTE : NOTE_W);
};
const laneWidth = (lane) => {
  const ws = lane.columns.map(colWidth);
  return Math.max(LANE_W, ws.length ? ws.reduce((a, b) => a + b, 0) + (ws.length - 1) * GAP_GROUP : LANE_W);
};
// 一條里程碑:卡片置中,便利貼排在它正下方
function placeCol(bi, li, ci, col, mid, yGroup, yNote) {
  const g = groupEl(bi, li, ci);
  const out = [place(g, mid - GROUP_W / 2, yGroup, GROUP_W)];
  const ns = notesOf(col);
  const nw = ns.length ? ns.length * NOTE_W + (ns.length - 1) * GAP_NOTE : 0;
  let nx = mid - nw / 2;
  for (const el of ns) {
    out.push(place(el, nx, yNote, NOTE_W));
    nx += NOTE_W + GAP_NOTE;
  }
  return out;
}
// 一個目標:它的里程碑攤在下一層,自己置中在它們上面
function placeLane(bi, li, lane, x, w, yLane, yGroup, yNote) {
  const ws = lane.columns.map(colWidth);
  const kidsW = ws.length ? ws.reduce((a, b) => a + b, 0) + (ws.length - 1) * GAP_GROUP : 0;
  let gx = x + (w - kidsW) / 2;
  const mids = [];
  const out = [];
  lane.columns.forEach((col, ci) => {
    const mid = gx + ws[ci] / 2;
    mids.push(mid);
    out.push(...placeCol(bi, li, ci, col, mid, yGroup, yNote));
    gx += ws[ci] + GAP_GROUP;
  });
  out.push(place(laneEl(bi, li), midOf(mids, x + w / 2) - LANE_W / 2, yLane, LANE_W));
  return out;
}

const zones = [];            // 「跳到」用得到的範圍
const zoneOf = new Map();    // 卡片 → 點它要縮放到的範圍
const ancestors = new Map(); // 便利貼 → 它上面那一串卡片
const X0 = BAND_X + BAND_W + SPINE + 30;
const bandWires = [];
let bandTop = (visionEl ? H.get(visionEl) : 0) + GAP_ROW;
D.bands.forEach((band, bi) => {
  const units = band.bare
    ? band.columns.map((col, ci) => ({ col, ci, li: -1, w: colWidth(col) }))
    : band.lanes.map((lane, li) => ({ lane, li, w: laneWidth(lane) }));
  const gap = band.bare ? GAP_GROUP : GAP_LANE;
  const shelves = [];
  for (const u of units) {
    const s = shelves[shelves.length - 1];
    if (!s || s.w + gap + u.w > MAX_SHELF) shelves.push({ items: [u], w: u.w });
    else { s.items.push(u); s.w += gap + u.w; }
  }
  const label = place(bandEl(bi), BAND_X, bandTop, BAND_W);
  const mine = [label];
  const inner = [];   // 這個區塊底下的目標,排在區塊本身後面進「跳到」
  const rows = [];
  let sy = bandTop;
  for (const s of shelves) {
    const yA = sy;
    const yB = yA + (band.bare ? groupRowH : laneRowH) + GAP_ROW;
    const yC = band.bare ? 0 : yB + groupRowH + GAP_ROW;
    let x = X0;
    const heads = [];
    let bottom = sy;
    for (const u of s.items) {
      const made = band.bare
        ? placeCol(bi, -1, u.ci, u.col, x + u.w / 2, yA, yB)
        : placeLane(bi, u.li, u.lane, x, u.w, yA, yB, yC);
      const head = box.get(band.bare ? groupEl(bi, -1, u.ci) : laneEl(bi, u.li));
      heads.push(head);
      mine.push(...made);
      bottom = Math.max(bottom, hull(made).y2);
      if (!band.bare) {
        zoneOf.set(laneEl(bi, u.li), hull(made));
        inner.push({ label: `　${u.lane.title}`, zone: hull(made) });
        u.lane.columns.forEach((col, ci) => {
          const g = groupEl(bi, u.li, ci);
          const kids = [box.get(g), ...notesOf(col).map((el) => box.get(el))];
          zoneOf.set(g, hull(kids));
          for (const el of notesOf(col)) ancestors.set(el, [g, laneEl(bi, u.li), bandEl(bi)]);
        });
      } else {
        const g = groupEl(bi, -1, u.ci);
        zoneOf.set(g, hull(made));
        for (const el of notesOf(u.col)) ancestors.set(el, [g, bandEl(bi)]);
      }
      x += u.w + gap;
    }
    rows.push({ armY: yA - GAP_ROW / 2, heads });
    sy = bottom + GAP_SHELF;
  }
  const zone = hull(mine);
  zoneOf.set(bandEl(bi), zone);
  zones.push({ label: band.title, zone }, ...inner);
  bandWires.push({ label, rows });
  bandTop = zone.y2 + GAP_BAND;
});

let totalW = Math.max(...[...box.values()].map((b) => b.x + b.w), VISION_W + LEFT);
if (visionEl) place(visionEl, LEFT, 0, VISION_W);
let maxY = Math.max(0, ...[...box.values()].map((b) => b.y + b.h));

// ── 連線:樹的骨架恆亮;引用是另一種線,箭頭那一端是被引用的那一份 ──
const cx = (b) => b.x + b.w / 2;
const paths = [`<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--wire)"></path></marker>
  <marker id="arrowWait" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--wait)"></path></marker>
  <marker id="arrowLit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--going)"></path></marker>
</defs>`];
const wire = (d) => paths.push(`<path class="tree" d="${d}"></path>`);
// 一個父節點對多個子節點:父底下一條豎線落到中間高度,一條橫幹接過去,再各自垂直落下
function bus(parent, kids) {
  if (!parent || !kids.length) return;
  const py = parent.y + parent.h;
  const mid = py + (Math.min(...kids.map((b) => b.y)) - py) / 2;
  const xs = kids.map(cx).concat(cx(parent));
  wire(`M ${cx(parent)} ${py} V ${mid}`);
  if (Math.max(...xs) - Math.min(...xs) > 0.5) wire(`M ${Math.min(...xs)} ${mid} H ${Math.max(...xs)}`);
  for (const b of kids) wire(`M ${cx(b)} ${mid} V ${b.y}`);
}
// 區塊標籤在左邊:從它的右緣拉一條支幹,每一排各自橫過去再垂直落下
function fanRight(label, rows) {
  const live = rows.filter((r) => r.heads.length);
  if (!live.length) return;
  const lx = label.x + label.w, ly = label.y + label.h / 2;
  const sx = lx + SPINE;
  const ys = [ly, ...live.map((r) => r.armY)];
  wire(`M ${lx} ${ly} H ${sx}`);
  if (Math.max(...ys) - Math.min(...ys) > 0.5) wire(`M ${sx} ${Math.min(...ys)} V ${Math.max(...ys)}`);
  for (const r of live) {
    wire(`M ${sx} ${r.armY} H ${Math.max(...r.heads.map(cx))}`);
    for (const b of r.heads) wire(`M ${cx(b)} ${r.armY} V ${b.y}`);
  }
}
// 願景垂一條主幹到左邊,每一個優先度區塊各自橫過去
if (visionEl && bandWires.length) {
  const v = box.get(visionEl);
  const labels = bandWires.map((w) => w.label);
  wire(`M ${TRUNK} ${v.y + v.h} V ${Math.max(...labels.map((b) => b.y + b.h / 2))}`);
  for (const b of labels) wire(`M ${TRUNK} ${b.y + b.h / 2} H ${b.x}`);
}
for (const w of bandWires) fanRight(w.label, w.rows);
D.bands.forEach((band, bi) => {
  if (band.bare) return;
  band.lanes.forEach((lane, li) => {
    const lb = box.get(laneEl(bi, li));
    const gs = lane.columns.map((_, ci) => box.get(groupEl(bi, li, ci))).filter(Boolean);
    bus(lb, gs);
  });
});
D.bands.forEach((band, bi) => {
  const cols = band.bare ? band.columns.map((col, ci) => [-1, ci, col]) : band.lanes.flatMap((lane, li) => lane.columns.map((col, ci) => [li, ci, col]));
  for (const [li, ci, col] of cols) bus(box.get(groupEl(bi, li, ci)), notesOf(col).map((el) => box.get(el)));
});
const elbow = (x1, y1, x2, y2) => `M ${x1} ${y1} C ${x1} ${y1 + (y2 - y1) / 2}, ${x2} ${y1 + (y2 - y1) / 2}, ${x2} ${y2}`;
for (const e of D.edges) {
  const a = noteEls.get(e.from); const b = noteEls.get(e.to);
  if (!a || !b || !box.get(a) || !box.get(b)) continue;
  const ba = box.get(a); const bb = box.get(b);
  const t = byName.get(e.to);
  // 被引用的那一份在下面就從底邊接到頂邊,在上面就反過來;同一排的兩張從底下繞過去,不壓到中間的卡片
  const below = Math.max(ba.y + ba.h, bb.y + bb.h) + 46;
  const d = ba.y + ba.h < bb.y ? elbow(cx(ba), ba.y + ba.h, cx(bb), bb.y)
    : bb.y + bb.h < ba.y ? elbow(cx(ba), ba.y, cx(bb), bb.y + bb.h)
      : `M ${cx(ba)} ${ba.y + ba.h} C ${cx(ba)} ${below}, ${cx(bb)} ${below}, ${cx(bb)} ${bb.y + bb.h}`;
  paths.push(`<path class="ref${t && !t.achieved ? ' blocking' : ''}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${d}"></path>`);
}
totalW = Math.max(totalW, ...[...box.values()].map((b) => b.x + b.w)) + 120;
maxY = Math.max(maxY, ...[...box.values()].map((b) => b.y + b.h)) + 60;
links.setAttribute('viewBox', `0 0 ${totalW} ${maxY}`);
links.setAttribute('width', totalW);
links.setAttribute('height', maxY);
links.innerHTML = paths.join('');
world.style.width = totalW + 'px';
world.style.height = maxY + 'px';

// ── 小地圖 ──
const canvas = document.getElementById('minimap');
const ctx = canvas.getContext('2d');
const CS = getComputedStyle(document.documentElement);
const cvar = (n) => CS.getPropertyValue(n).trim() || '#888';
const MW = 246, MH = 158;
let ms = 1, mox = 0, moy = 0;
const base = document.createElement('canvas');
function drawBase(dpr) {
  base.width = MW * dpr; base.height = MH * dpr;
  const b = base.getContext('2d');
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  b.clearRect(0, 0, MW, MH);
  ms = Math.min((MW - 8) / (totalW || 1), (MH - 8) / (maxY || 1));
  mox = (MW - totalW * ms) / 2;
  moy = (MH - maxY * ms) / 2;
  for (const [el, r] of box) {
    const kind = el.dataset.kind;
    b.fillStyle = kind === 'note' ? cvar('--' + el.dataset.tone) : kind === 'band' ? cvar('--ink') : cvar('--wire');
    b.globalAlpha = kind === 'note' ? 0.95 : 0.55;
    b.fillRect(mox + r.x * ms, moy + r.y * ms, Math.max(1.5, r.w * ms), Math.max(1.5, r.h * ms));
  }
  b.globalAlpha = 1;
}
function drawMini() {
  if (miniEl.hidden) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (canvas.width !== MW * dpr) { canvas.width = MW * dpr; canvas.height = MH * dpr; drawBase(dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, MW, MH);
  ctx.drawImage(base, 0, 0, MW, MH);
  const r = stage.getBoundingClientRect();
  const vw = r.width - (asideEl.hidden ? 0 : asideEl.offsetWidth);
  ctx.strokeStyle = cvar('--going');
  ctx.lineWidth = 1.5;
  ctx.strokeRect(mox + (-tx / k) * ms, moy + (-ty / k) * ms, (vw / k) * ms, (r.height / k) * ms);
}
function miniGo(ev) {
  const r = canvas.getBoundingClientRect();
  goTo((ev.clientX - r.left - mox) / ms, (ev.clientY - r.top - moy) / ms);
}
let miniDrag = false;
canvas.addEventListener('pointerdown', (ev) => { miniDrag = true; canvas.setPointerCapture(ev.pointerId); miniGo(ev); });
canvas.addEventListener('pointermove', (ev) => { if (miniDrag) miniGo(ev); });
canvas.addEventListener('pointerup', () => { miniDrag = false; });

const jump = document.getElementById('jump');
jump.innerHTML = `<option value="">跳到…</option><option value="fit">全景</option>${
  zones.map((z, i) => `<option value="${i}">${esc(z.label)}</option>`).join('')}`;
jump.addEventListener('change', () => {
  if (jump.value === 'fit') fit();
  else if (jump.value !== '') zoomTo(zones[+jump.value].zone);
  jump.value = '';
});

// ── 平移縮放 ──
let k = 1, tx = 0, ty = 0;
const sideW = () => (asideEl.hidden ? 0 : asideEl.offsetWidth);
function apply() {
  world.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
  document.getElementById('zoom').textContent = Math.round(k * 100) + '%';
  drawMini();
}
function fit() {
  const r = stage.getBoundingClientRect();
  const pad = 40;
  k = Math.min(2, Math.max(0.04, Math.min((r.width - pad * 2 - sideW()) / (totalW || 1), (r.height - pad * 2) / (maxY || 1))));
  tx = pad + ((r.width - sideW()) - pad * 2 - totalW * k) / 2;
  ty = pad;
  apply();
}
function zoomTo(s) {
  const r = stage.getBoundingClientRect();
  const vw = r.width - sideW() - 60;
  const vh = r.height - 60;
  k = Math.min(1.15, Math.max(0.04, Math.min(vw / Math.max(1, s.x2 - s.x1), vh / Math.max(1, s.y2 - s.y1))));
  tx = 30 + (vw - (s.x2 - s.x1) * k) / 2 - s.x1 * k;
  ty = 30 + (vh - (s.y2 - s.y1) * k) / 2 - s.y1 * k;
  apply();
}
function goTo(wx, wy) {
  const r = stage.getBoundingClientRect();
  tx = (r.width - sideW()) / 2 - wx * k;
  ty = r.height / 2 - wy * k;
  apply();
}
function zoomAt(px, py, nk) {
  const next = Math.min(2.5, Math.max(0.04, nk));
  tx = px - (px - tx) * (next / k);
  ty = py - (py - ty) * (next / k);
  k = next;
  apply();
}
stage.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  if (ev.ctrlKey || ev.metaKey) zoomAt(ev.clientX - r.left, ev.clientY - r.top, k * (ev.deltaY < 0 ? 1.12 : 0.89));
  else { tx -= ev.deltaX; ty -= ev.deltaY; apply(); }
}, { passive: false });

let drag = null, moved = 0;
// 這裡不擋預設行為:擋了瀏覽器就不發 click,點卡片會沒反應。選字交給 CSS,拖曳交給 dragstart
stage.addEventListener('dragstart', (ev) => ev.preventDefault());
stage.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  moved = 0;   // 這一下點下去就重算;上一次拖曳沒收尾也不會吃掉這一次的點選
  drag = { x: ev.clientX, y: ev.clientY, tx, ty };
  stage.setPointerCapture(ev.pointerId);
  stage.classList.add('grabbing');
});
stage.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.x; const dy = ev.clientY - drag.y;
  moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  tx = drag.tx + dx; ty = drag.ty + dy;
  apply();
});
stage.addEventListener('pointerup', () => {
  if (!drag) return;
  stage.classList.remove('grabbing');
  drag = null;
});
// 拖曳歸拖曳、點選歸點選:拖過的那一下不算點到
stage.addEventListener('click', (ev) => {
  if (moved >= 5) return;
  const note = ev.target.closest('.note');
  if (note) { select(note.dataset.name === selected ? null : note.dataset.name); return; }
  const card = ev.target.closest('.band, .lane, .group');
  if (card && zoneOf.has(card)) { zoomTo(zoneOf.get(card)); return; }
  select(null);
});
document.getElementById('zoomin').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, k * 1.25); };
document.getElementById('zoomout').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, k * 0.8); };
document.getElementById('fit').onclick = fit;
document.getElementById('side').onclick = (ev) => {
  asideEl.hidden = !asideEl.hidden;
  ev.currentTarget.setAttribute('aria-pressed', String(!asideEl.hidden));
  apply();
};
document.getElementById('minitoggle').onclick = (ev) => {
  miniEl.hidden = !miniEl.hidden;
  ev.currentTarget.setAttribute('aria-pressed', String(!miniEl.hidden));
  apply();
};
document.getElementById('helpbtn').onclick = () => { helpEl.hidden = !helpEl.hidden; };
helpEl.addEventListener('click', (ev) => { if (ev.target.classList.contains('close')) helpEl.hidden = true; });

// ── 篩選與選取 ──
function related(name) {
  const d = byName.get(name);
  if (!d) return new Set([name]);
  return new Set([name, ...d.refs, ...d.referrers, ...d.blockedBy]);
}
function passes(d) {
  if (!d) return true;
  if (query) {
    const hay = [d.name, d.description, d.state, ...d.modules, ...d.steps.map((x) => x.name)].join(' ').toLowerCase();
    if (!hay.includes(query)) return false;
  }
  if (filter === 'open') return D.lines.openable.some((x) => x.name === d.name) || D.lines.building.some((x) => x.name === d.name);
  if (filter === 'stuck') return d.gaps.length > 0 || d.blockedBy.length > 0;
  if (filter === 'todo') return !d.achieved;
  if (filter === 'warn') return D.warnings.some((w) => w.where === d.name || w.where.startsWith(d.name + '#'));
  return true;
}
function paint() {
  const rel = selected ? related(selected) : null;
  for (const el of cards) el.classList.remove('rel', 'sel', 'path');
  for (const [name, el] of noteEls) {
    const d = byName.get(name);
    const on = (rel ? rel.has(name) : true) && passes(d);
    el.classList.toggle('dim', !on);
    if (name === selected) el.classList.add('sel');
    else if (rel && rel.has(name)) el.classList.add('rel');
  }
  // 選了一份就把它頭上那一串也點亮:一眼看得出它掛在哪個優先度、哪個目標底下
  if (selected && noteEls.has(selected)) for (const el of (ancestors.get(noteEls.get(selected)) || [])) el.classList.add('path');
  for (const p of links.querySelectorAll('.ref')) {
    p.classList.toggle('lit', !!selected && (p.dataset.from === selected || p.dataset.to === selected));
  }
}

function stepRows(d) {
  if (!d.steps.length) return `<tr><td colspan="3" class="empty">沒有任何 ${esc(D.labels.steps)}</td></tr>`;
  return d.steps.map((x) => `<tr>
    <td class="s">${esc(x.index)}${x.ref ? ` 見 ${esc(x.ref)}` : ''}</td>
    <td><code>${esc(x.signature)}</code><br><span class="empty">${esc(x.module)} · ${esc(x.layer)}${x.at && x.at !== x.module ? ` → 實際在 ${esc(x.at)}` : ''}</span></td>
    <td class="s">${esc(x.state)}</td></tr>`).join('');
}
const linkTo = (n) => (byName.has(n) ? `<button class="jump" data-go="${esc(n)}">${esc(n)}</button>` : esc(n));
function openDoc(name) {
  const d = byName.get(name);
  const warns = D.warnings.filter((w) => w.where === name || w.where.startsWith(name + '#'));
  homeEl.hidden = true;
  docEl.hidden = false;
  asideEl.hidden = false;
  document.getElementById('side').setAttribute('aria-pressed', 'true');
  docEl.scrollTop = 0;
  asideEl.scrollTop = 0;
  if (!d) {
    // 里程碑綁了這個名字,但這一份根本不在樹裡
    docEl.innerHTML = `<button class="back">返回</button><h2>${esc(name)}</h2>
      <p class="sub">有里程碑綁了這個名字,${esc(D.labels.unit)}裡沒有這一份</p>
      <p class="sub">要嘛把綁定改掉,要嘛建出這一份</p>`;
    return;
  }
  const why = (TERMS.find(([t]) => t === tone(d)) || [])[2] || '';
  docEl.innerHTML = `
    <button class="back">返回</button>
    <h2>${esc(d.name)}</h2>
    <p class="sub">${esc(d.kind || '')} · ${esc(d.status || '沒有 status')}${d.objective ? ` · ${esc(d.objective)} 優先 ${esc(d.priority ?? '?')} · ${esc(d.milestone)}` : ' · 沒有綁到任何目標'}</p>
    <p class="sub"><span class="dot" style="background:var(--${tone(d)})"></span><b>${esc(d.state)}</b> — ${esc(why)}</p>
    <p class="sub">${esc(d.description)}</p>
    <section><h3>${esc(D.labels.steps)}(簽名 ${d.signatures.matched}/${d.signatures.total} 對到,骨架 ${d.signatures.stub}${d.observations.total ? ` · 觀察點 ${d.observations.matched}/${d.observations.total}` : ''})</h3>
      <table><thead><tr><th>列</th><th>簽名 / 模組</th><th>狀態</th></tr></thead><tbody>${stepRows(d)}</tbody></table></section>
    <section><h3>Laws(通過 ${d.laws.green === null ? 'nan' : d.laws.green} / ${d.laws.total},翻成測試 ${d.laws.traced})</h3>
      ${d.laws.total ? `<ul>${d.laws.items.map((l) => `<li><span class="dot ${dotOf(l.result)}"></span>${esc(l.id)} [${esc(l.kind)}] ${esc(l.title)} — ${esc(l.result)}</li>`).join('')}</ul>` : '<p class="empty">一條 law 都沒寫</p>'}</section>
    ${d.examples.total ? `<section><h3>Examples</h3><ul>${d.examples.items.map((e) => `<li><span class="dot ${dotOf(e.result)}"></span>${esc(e.id)} 覆蓋 ${esc(e.covers.join('、'))} — ${esc(e.result)}</li>`).join('')}</ul></section>` : ''}
    <section><h3>關係</h3><ul>
      <li>引用了:${d.refs.length ? d.refs.map(linkTo).join('、') : '無'}</li>
      <li>被引用:${d.referrers.length ? d.referrers.map(linkTo).join('、') : '無'}</li>
      <li>等誰:${d.blockedBy.length ? d.blockedBy.map(linkTo).join('、') : '無'}</li>
      <li>住哪裡:${d.modules.length ? d.modules.map((m) => `<code>${esc(m)}</code>`).join('、') : '無'}</li>
    </ul></section>
    ${d.gaps.length ? `<section><h3>GAP</h3><ul>${d.gaps.map((g) => `<li>${esc(g)}</li>`).join('')}</ul></section>` : ''}
    ${warns.length ? `<section><h3>警訊</h3>${warns.map((w) => `<div class="warn"><b>${esc(w.where)}</b>${esc(w.what)}<i>${esc(w.fix)}</i></div>`).join('')}</section>` : ''}
    ${d.revisions.count ? `<section><h3>修訂</h3><p class="sub">REV ${d.revisions.count} 條,最後一條:${esc(d.revisions.last || '')}</p></section>` : ''}`;
}
function select(name) {
  selected = name;
  paint();
  if (name) openDoc(name);
  else { docEl.hidden = true; homeEl.hidden = false; }
}
docEl.addEventListener('click', (ev) => {
  if (ev.target.classList.contains('back')) { select(null); return; }
  const go = ev.target.closest('[data-go]');
  if (go) { select(go.dataset.go); const el = noteEls.get(go.dataset.go); if (el && box.get(el)) zoomTo(zoneOf.get(el) || { x1: box.get(el).x - 200, y1: box.get(el).y - 200, x2: box.get(el).x + box.get(el).w + 200, y2: box.get(el).y + box.get(el).h + 200 }); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === 'Escape') { helpEl.hidden = true; select(null); }
  if (ev.key === '0') fit();
});

for (const b of document.querySelectorAll('.bar button[data-filter]')) {
  b.addEventListener('click', () => {
    filter = b.dataset.filter;
    for (const o of document.querySelectorAll('.bar button[data-filter]')) o.setAttribute('aria-pressed', String(o === b));
    paint();
  });
}
document.getElementById('q').addEventListener('input', (ev) => { query = ev.target.value.trim().toLowerCase(); paint(); });
const refmode = document.getElementById('refmode');
const setRefMode = () => { links.setAttribute('class', `refs-${refmode.value}`); };
refmode.addEventListener('change', setRefMode);

setTopHeight();
setRefMode();
paint();
fit();
addEventListener('resize', () => { setTopHeight(); fit(); });
</script>
</body>
</html>
