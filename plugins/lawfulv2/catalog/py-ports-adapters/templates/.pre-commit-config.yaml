# 安裝：uv run pre-commit install（make sync 會做）
# 全部用 uv run 在專案的虛擬環境裡跑，pyright 與 import-linter 才看得到專案的套件。
# pytest 不在這裡跑（太慢），交給 CI。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: check-laws
        name: check laws
        entry: uv run python -m scripts.check_laws
        language: system
        pass_filenames: false
        files: ^src/__PACKAGE__/domains/
      - id: check-glossary
        name: check glossary
        entry: uv run python -m scripts.check_glossary
        language: system
        pass_filenames: false
        files: ^(docs/glossary\.md|src/__PACKAGE__/domains/)
      - id: check-entries
        name: check entries
        entry: uv run python -m scripts.check_entries
        language: system
        pass_filenames: false
        files: ^src/__PACKAGE__/
      - id: check-errors
        name: check errors
        entry: uv run python -m scripts.check_errors
        language: system
        pass_filenames: false
        files: ^src/__PACKAGE__/
