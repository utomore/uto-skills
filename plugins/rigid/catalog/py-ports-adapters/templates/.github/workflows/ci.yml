# PR 檢查。步驟的 id 固定：docs/plan 驗收行尾的證據 `ci:<id>` 對到這裡。
name: ci
on:
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: sync
        run: uv sync
      - id: check
        run: make check
      - id: unit
        run: make test
